const SECTIONS = [S1,S2,S3,S4,S5,S6];
const NAMES = {idea:'Idea de memoria virtual', paginacion:'Paginación sin / con MV', traduccion:'Traducción de direcciones', vecindad:'Principio de vecindad', politicas:'Políticas', algoritmos:'Algoritmos de reemplazo'};
const App = {
  cur:null, tab:'concepto', inited:new Set(),
  start(){
    readColors();
    $('#nav').innerHTML = SECTIONS.map((s,j)=>`<a href="#${s.id}" data-id="${s.id}"><span class="n">${j+1}</span>${NAMES[s.id]}</a>`).join('');
    $$('.tabs button').forEach(b=>b.onclick=()=>{ this.tab=b.dataset.tab; $$('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); $$('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+this.tab)); });
    $('#bSound').onclick = ()=>this.toggleSound();
    $('#bProj').onclick = ()=>this.toggleProj();
    document.addEventListener('keydown', e=>{
      if(e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
      const st = this.cur && this.cur.stepper;
      if(e.key==='ArrowRight' && st){ Sound.ensure(); st.stop(); st.next(); e.preventDefault(); }
      else if(e.key==='ArrowLeft' && st){ st.stop(); st.prev(); e.preventDefault(); }
      else if(e.key===' ' && st){ Sound.ensure(); st.play(); e.preventDefault(); }
      else if(e.key==='r'||e.key==='R'){ st && st.reset(); }
      else if(e.key==='p'||e.key==='P') this.toggleProj();
      else if(e.key==='s'||e.key==='S') this.toggleSound();
    });
    document.addEventListener('click', e=>{ const b = e.target.closest('[data-copysvg]'); if(b) this.copySVG(b.dataset.copysvg); });
    $('#svgOutClose').onclick = ()=>$('#svgOut').classList.remove('on');
    window.addEventListener('hashchange', ()=>this.route());
    if(load('proj',false)) this.toggleProj(true);
    this.route();
    const r = runSelfTests();
    if(r.fails.length){ const w=$('#testwarn'); w.style.display='block'; w.textContent = `Atención: ${r.fails.length} de ${r.total} casos de control no coinciden con la cátedra (ver consola, prefijo [TEST]).`; }
  },
  route(){
    const id = (location.hash||'').slice(1);
    this.show(SECTIONS.find(s=>s.id===id) ? id : 'idea');
  },
  show(id){
    const sec = SECTIONS.find(s=>s.id===id);
    if(this.cur && this.cur.stepper) this.cur.stepper.stop();
    if(this.cur && this.cur!==sec) window.scrollTo(0,0);
    this.cur = sec;
    $$('section.view').forEach(v=>v.classList.toggle('on', v.dataset.sec===id));
    $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.id===id));
    if(!this.inited.has(id)){ this.inited.add(id); sec.init(); }
    else sec.render();
    this.refreshPanels(true);
  },
  refreshPanels(withExercise){
    const sec = this.cur, c = CONTENT[sec.id];
    let concept = c.concepto;
    if(sec.id==='politicas') concept = c.sub[S5.sub] + c.concepto;
    if(sec.id==='algoritmos' && S6.view==='belady') concept = c.belady + concept;
    $('#pane-concepto').innerHTML = concept;
    $('#pane-vyd').innerHTML = sec.id==='politicas' ? c.vydSub[S5.sub] : c.vyd;
    this.paintSteps();
    if(withExercise) sec.exercise($('#pane-ejercicio'));
  },
  paintSteps(){
    const sec = this.cur; if(!sec) return;
    const items = sec.steps(), i = sec.stepper ? sec.stepper.i : 0;
    let curIdx;
    if(items[0] && items[0].at!=null){ curIdx = 0; const b = S4.trace.bounds; b.forEach((x,j)=>{ if(i>=x) curIdx=j; }); }
    else curIdx = Math.min(i, items.length-1);
    $('#pane-pasos').innerHTML = `<h3>Paso a paso</h3><p class="note">Hacé clic en un paso para ir a él. Teclado: ← → espacio R.</p><ol class="steplist">${items.map((s,j)=>`<li data-j="${j}" class="${j===curIdx?'on':''} ${j<curIdx?'done':''}">${String(s.text).startsWith(s.k)?'':`<span class="k">${esc(s.k)}</span>`}${esc(s.text)}</li>`).join('')}</ol>`;
    $$('#pane-pasos li').forEach(li=>li.onclick=()=>{ const j=+li.dataset.j; const it=items[j]; sec.stepper && sec.stepper.set(it.at!=null?it.at:j); });
    const on = $('#pane-pasos li.on'); if(on && this.tab==='pasos'){ const pane=$('#side'); const r=on.getBoundingClientRect(); if(r.top<120||r.bottom>window.innerHeight) on.scrollIntoView({block:'nearest'}); }
  },
  afterRender(sec){ if(sec===this.cur) this.paintSteps(); },
  toggleSound(){ Sound.ensure(); Sound.on = !Sound.on; $('#bSound').setAttribute('aria-pressed', Sound.on); if(Sound.on){ try{ Sound.ctx && Sound.ctx.resume(); }catch(e){} Sound.play('hit'); } },
  toggleProj(force){ const on = force===true ? true : !document.body.classList.contains('proj'); document.body.classList.toggle('proj', on); document.documentElement.classList.toggle('proj', on); $('#bProj').setAttribute('aria-pressed', on); store('proj', on); if(this.cur) this.cur.render(); },
  copySVG(id){
    let svg = id==='svgGridMain' ? ($('#algMain svg') ? null : null) : $('#'+id);
    let txt;
    if(id==='svgGridMain'){ const first = $('#algMain svg'); txt = first && S6.view!=='tabla' ? first.outerHTML : gridSVG(S6.sim, S6.sim.steps.length, {}); }
    else { const cl = svg.cloneNode(true); cl.setAttribute('xmlns','http://www.w3.org/2000/svg'); cl.insertAdjacentHTML('afterbegin', `<style>.m{font-family:"JetBrains Mono",ui-monospace,monospace}.s{font-family:"Source Serif 4",Georgia,serif}text{font-family:Inter,system-ui,sans-serif}</style><rect x="-10000" y="-10000" width="20000" height="20000" fill="${C.paper}"/>`); txt = cl.outerHTML; }
    $('#svgOutTa').value = txt; $('#svgOut').classList.add('on');
    try{ navigator.clipboard.writeText(txt).then(()=>{ $('#svgOut .note').textContent='SVG copiado al portapapeles. También podés copiarlo desde aquí:'; }, ()=>{ $('#svgOut .note').textContent='No se pudo usar el portapapeles: seleccioná y copiá el texto.'; }); }catch(e){ $('#svgOut .note').textContent='No se pudo usar el portapapeles: seleccioná y copiá el texto.'; }
    $('#svgOutTa').select();
  }
};

/* =====================================================================
   CONTENIDO DE LAS PESTAÑAS
   ===================================================================== */
const CONTENT = {
idea:{
concepto:`<h3>¿Qué es la memoria virtual?</h3>
<p>Es una técnica del sistema operativo que permite ejecutar un proceso <b>sin que toda su imagen</b> (PCB, datos, instrucciones y pila) esté cargada en la memoria principal. La imagen completa se guarda en el <b>disco rígido</b> (área de intercambio) y en la RAM sólo residen las partes que se están usando.</p>
<p>Cuando el proceso referencia una parte que no está en memoria, el hardware lo detecta y el SO la trae desde el disco: es un <b>fallo de página</b>. El programador ve un espacio de direcciones grande y continuo (memoria <i>virtual</i>), independiente de cuánta memoria <i>real</i> haya.</p>
<div class="def">Objetivos de la administración de memoria: simplificar (y abstraer) el uso de la memoria a los usuarios, optimizar el uso de la memoria principal y permitir proteger y compartir datos.</div>
<h4>En el diagrama</h4>
<ul><li>Con <b>memoria virtual</b> el proceso arranca sin páginas en RAM y las va cargando por demanda.</li><li>Con <b>sin memoria virtual</b>, si los marcos disponibles no alcanzan para la imagen completa el proceso directamente no puede ejecutarse.</li><li>Variá la cantidad de marcos: con menos marcos hay más fallos.</li></ul>`,
vyd:`<h3>Ventajas</h3><ul class="pro"><li>Se pueden ejecutar procesos más grandes que la memoria física.</li><li>Más procesos simultáneos en memoria (mayor grado de multiprogramación): cada uno ocupa sólo lo que usa.</li><li>Arranque más rápido: no hace falta leer toda la imagen antes de ejecutar.</li><li>Se aprovechan mejor los marcos: partes que nunca se usan (rutinas de error, por ejemplo) no consumen RAM.</li></ul>
<h3>Desventajas</h3><ul class="con"><li>Cada fallo de página cuesta una E/S de disco: miles de veces más lento que un acceso a RAM.</li><li>Requiere soporte de hardware (bit de presencia, excepción de fallo de página) y un SO más complejo.</li><li>Con pocos marcos aparece la <b>hiperpaginación</b> (thrashing): el sistema pasa más tiempo cargando páginas que ejecutando.</li><li>El tiempo de acceso a memoria deja de ser predecible.</li></ul>`},
paginacion:{
concepto:`<h3>Paginación sin y con memoria virtual</h3>
<p>En la paginación la imagen del proceso se divide en <b>páginas</b> de tamaño fijo y la memoria en <b>marcos</b> (frames) del mismo tamaño. La <b>tabla de páginas</b> indica en qué marco está cada página. En el ejemplo, P1 ocupa 176 B y la página mide 20 B: son 9 páginas (P0…P8), la última con 16 B útiles.</p>
<p><b>Sin memoria virtual</b> todas las páginas deben estar cargadas para que el proceso ejecute; la tabla sólo tiene Página → Marco.</p>
<p><b>Con memoria virtual</b> la tabla agrega la columna <b>¿Presente?</b>: sólo algunas páginas están en RAM (en el ejemplo, 2→7, 5→22 y 6→10). Las demás están en disco y su marco figura como “-”.</p>
<div class="def">Dirección absoluta = Nro de marco × tamaño de página + desplazamiento.</div>`,
vyd:`<h3>Paginación con memoria virtual</h3><ul class="pro"><li>No hay fragmentación externa: cualquier marco libre sirve para cualquier página.</li><li>Las páginas de un proceso no necesitan ser contiguas ni estar todas cargadas.</li><li>Facilita compartir páginas (código común) y proteger por página.</li></ul>
<ul class="con"><li>Fragmentación interna en la última página (P8 usa 16 de 20 B).</li><li>La tabla de páginas ocupa memoria (una entrada por página) y cada acceso requiere consultarla.</li><li>Los accesos a páginas no presentes provocan fallos de página costosos.</li></ul>`},
traduccion:{
concepto:`<h3>Traducción de direcciones con bit de presencia</h3>
<p>El proceso trabaja con <b>direcciones relativas (o virtuales)</b>, formadas por <span class="mono">Nro Página | Desplazamiento</span>. El hardware usa el número de página como índice en la tabla de páginas del proceso:</p>
<ul><li>Si la página está <b>Presente</b>, reemplaza el Nro Página por el <b>Nro Marco</b> y conserva el desplazamiento: se obtiene la <b>dirección absoluta (o real)</b>.</li><li>Si <b>No está presente</b>, genera un <b>fallo de página</b>: una interrupción que transfiere el control al SO, que trae la página desde el disco a memoria principal, actualiza la tabla y hace que la instrucción se reintente.</li></ul>
<h4>¿Quién hace qué?</h4>
<table class="pt" style="font-size:.8rem"><tr><th>Tarea</th><th>Responsable</th></tr><tr><td style="text-align:left">Administración de páginas y marcos</td><td>Sistema Operativo</td></tr><tr><td style="text-align:left">Traducción Nro Página → Nro Marco</td><td>Hardware</td></tr><tr><td style="text-align:left">Carga de páginas no presentes</td><td>Sistema Operativo</td></tr></table>
<p style="margin-top:8px">Si el tamaño de página es potencia de 2, dividir es sólo separar bits: con páginas de 1 KB los 10 bits bajos son el desplazamiento.</p>`,
vyd:`<h3>Ventajas</h3><ul class="pro"><li>La traducción por hardware es rápida y transparente para el programa.</li><li>El bit de presencia permite detectar automáticamente qué falta cargar.</li><li>El SO sólo interviene cuando hay un fallo: el caso común (página presente) no lo involucra.</li></ul>
<h3>Desventajas</h3><ul class="con"><li>Cada acceso a memoria requiere además leer la tabla de páginas (en la práctica se usa una caché, la TLB).</li><li>El fallo de página bloquea al proceso durante una E/S de disco.</li><li>La instrucción interrumpida debe poder reiniciarse: exige cuidado en el diseño del procesador.</li></ul>`},
vecindad:{
concepto:`<h3>Principio de vecindad (localidad)</h3>
<p>Durante un intervalo de tiempo, un proceso tiende a referenciar un <b>conjunto reducido de páginas</b> (un bucle, la pila, las variables que está usando). Con el tiempo ese conjunto cambia, pero lentamente. Por eso la memoria virtual funciona: si las páginas de la “zona activa” están en memoria, los fallos son poco frecuentes.</p>
<p>El <b>conjunto de trabajo</b> W(t, Δ) es el conjunto de páginas referenciadas en las últimas Δ referencias. Su tamaño indica cuántos marcos necesita el proceso en ese momento.</p>
<h4>Se debe tener cuidado al determinar</h4>
<ul><li><b>Tamaño de las páginas</b>: páginas pequeñas aprovechan mejor la localidad pero requieren más marcos y tablas más grandes; páginas grandes cargan información que quizá no se use.</li><li><b>Páginas asignadas en memoria principal</b>: la <b>cantidad</b> (cercana al conjunto de trabajo) y la <b>asignación</b>: <i>fija</i> (cantidad constante de marcos) o <i>variable</i> (la cantidad se ajusta a lo largo de la ejecución).</li></ul>
<p class="note">La traza del diagrama es sintética pero tiene fases de localidad, como la figura de la diapositiva.</p>`,
vyd:`<h3>Asignación fija</h3><ul class="pro"><li>Simple de implementar y predecible.</li><li>Un proceso no perjudica a otros.</li></ul><ul class="con"><li>Si se asignan pocos marcos, muchos fallos; si son demasiados, se desperdicia memoria.</li><li>No se adapta a los cambios de fase del proceso.</li></ul>
<h3>Asignación variable (conjunto de trabajo)</h3><ul class="pro"><li>Ajusta la memoria a la localidad real del proceso.</li><li>Permite mantener más procesos con pocos fallos.</li></ul><ul class="con"><li>Mayor sobrecarga: hay que medir el uso de páginas.</li><li>Elegir Δ no es trivial: chico, pierde localidad; grande, desperdicia memoria.</li></ul>`},
politicas:{
concepto:`<h4>Las tres políticas</h4><ul><li><b>Búsqueda</b>: cuándo traer una página a memoria (por demanda / pre-paginación).</li><li><b>Limpieza</b>: cuándo escribir en disco una página modificada (por demanda / pre-limpieza / usando buffer).</li><li><b>Reemplazo</b>: qué página desalojar; su <b>alcance</b> puede ser local o global, y los principales algoritmos son Óptimo, FIFO, LRU y LFU (sección 6).</li></ul>`,
sub:{
busqueda:`<h3>Política de Búsqueda</h3><p><b>Por demanda:</b> una página se trae a memoria sólo cuando se la referencia y produce un fallo. Al comenzar la ejecución hay muchos fallos; luego, por el principio de vecindad, se estabiliza.</p><p><b>Pre-paginación:</b> además de la página pedida se traen otras (por ejemplo, las contiguas en disco), aprovechando que leer varios bloques seguidos cuesta casi lo mismo que leer uno. Funciona bien si esas páginas efectivamente se usan.</p>`,
limpieza:`<h3>Política de Limpieza</h3><p>Determina cuándo se escribe en disco una página <b>modificada</b> (bit M = 1).</p><ul><li><b>Por demanda:</b> se escribe sólo cuando es elegida para reemplazo. El proceso que produjo el fallo espera dos E/S.</li><li><b>Pre-limpieza:</b> se escriben antes de necesitar sus marcos, en lotes.</li><li><b>Usando buffer:</b> las víctimas pasan a listas de páginas libres o modificadas; las modificadas se escriben por lotes, y si una página se vuelve a referenciar mientras está en el buffer se recupera sin E/S.</li></ul>`,
alcance:`<h3>Política de Reemplazo: alcance</h3><p><b>Local:</b> la víctima se elige entre las páginas del <i>mismo</i> proceso que produjo el fallo. Va de la mano con la asignación fija (el ejemplo de la cátedra: 3 marcos, reemplazo local).</p><p><b>Global:</b> la víctima puede ser cualquier página de la memoria, de cualquier proceso. Un proceso puede “robar” marcos a otro.</p><p>En el diagrama ambos usan LRU; P2 recorre más páginas que P1.</p>`},
vyd:'',
vydSub:{
busqueda:`<h3>Por demanda</h3><ul class="pro"><li>Sólo se cargan páginas que realmente se usan.</li></ul><ul class="con"><li>Muchos fallos al iniciar o al cambiar de fase.</li></ul><h3>Pre-paginación</h3><ul class="pro"><li>Menos fallos y menos operaciones de E/S si hay acceso secuencial.</li></ul><ul class="con"><li>Desperdicia memoria y E/S si las páginas precargadas no se usan (probá la cadena “dispersa”).</li></ul>`,
limpieza:`<h3>Por demanda</h3><ul class="pro"><li>Sólo se escribe lo estrictamente necesario.</li></ul><ul class="con"><li>El fallo tarda el doble si la víctima está modificada.</li></ul><h3>Pre-limpieza</h3><ul class="pro"><li>En el fallo sólo hay que leer; las escrituras se agrupan.</li></ul><ul class="con"><li>Puede escribir páginas que se vuelven a modificar antes de ser reemplazadas: E/S desperdiciada.</li></ul><h3>Usando buffer</h3><ul class="pro"><li>Combina lo mejor: escrituras en lote y posibilidad de recuperar víctimas sin E/S.</li></ul><ul class="con"><li>Reserva marcos para el buffer y complica la administración.</li></ul>`,
alcance:`<h3>Local</h3><ul class="pro"><li>Aísla a los procesos: el comportamiento de uno no afecta a los demás.</li><li>Predecible.</li></ul><ul class="con"><li>No aprovecha marcos que otro proceso no está usando.</li><li>Un proceso con pocos marcos puede hiperpaginar aunque haya memoria ociosa.</li></ul><h3>Global</h3><ul class="pro"><li>Se adapta automáticamente: quien más necesita, más marcos obtiene.</li><li>Suele dar menos fallos en total.</li></ul><ul class="con"><li>Un proceso puede quitarle marcos a otro y empeorar su rendimiento.</li><li>Los fallos de un proceso dependen de los demás.</li></ul>`}},
algoritmos:{
belady:`<h3>Complementario: anomalía de Belady</h3><p>Lo intuitivo es que con más marcos haya menos fallos. Con <b>FIFO</b> no siempre ocurre: con la cadena 1 2 3 4 1 2 5 1 2 3 4 5 hay <b>9 fallos con 3 marcos</b> y <b>10 fallos con 4</b>. LRU y Óptimo no sufren esta anomalía: el conjunto de páginas en memoria con k marcos siempre está incluido en el que tendrían con k + 1 (algoritmos “de pila”). Los fallos con marcos vacíos también cuentan.</p><hr style="border:0;border-top:1px solid var(--rule)">`,
concepto:`<h3>Algoritmos de reemplazo</h3>
<p>Cuando hay un fallo de página y el proceso no tiene marcos libres, el SO debe elegir una <b>víctima</b>. Con reemplazo local y asignación fija (3 marcos), la víctima es siempre una página del mismo P1.</p>
<ul>
<li><b>Óptimo o Ideal:</b> reemplaza la página que tardará más en volver a usarse. Da el mínimo de fallos posible, pero requiere conocer el futuro: sirve como referencia para comparar. Si hay empate (varias que no se vuelven a usar), en este laboratorio se desempata por LRU.</li>
<li><b>FIFO</b> (First-In First-Out): reemplaza la página cargada hace más tiempo (columna <i>Tiempo Carga</i>). Simple, pero puede desalojar páginas muy usadas.</li>
<li><b>LRU</b> (Least Recently Used): reemplaza la página usada hace más tiempo (columna <i>Tiempo Último Acceso</i>, que se actualiza en cada acceso y al cargar). Aproxima bien al óptimo gracias al principio de vecindad.</li>
<li><b>LFU</b> (Least Frequently Used): reemplaza la página con menos accesos (columna <i>Cantidad de Accesos</i>). Una página recién cargada empieza en 0 y suma 1 en cada acceso posterior.</li></ul>
<h4>Cómo leer la tabla</h4>
<p>Como en las diapositivas: los valores que cambian quedan <span class="st">tachados</span> y el nuevo se escribe al lado. La flecha ocre marca la página referenciada; la roja, la víctima. Para cada dirección se calcula # Pág. = dirección div 1024 y desplazamiento = dirección − inicio de la página.</p>
<h4>Complementario: Segunda Oportunidad / Reloj</h4>
<p>Variante de FIFO con un <b>bit de referencia R</b> por página. El puntero recorre los marcos en orden de carga: si R = 1, lo pone en 0 y le da una “segunda oportunidad”; si R = 0, esa página es la víctima. Aproxima a LRU con muy poco costo de hardware.</p>`,
vyd:`<h3>Óptimo</h3><ul class="pro"><li>Mínima cantidad de fallos: cota inferior para evaluar otros algoritmos.</li></ul><ul class="con"><li>Irrealizable: requiere conocer las referencias futuras.</li></ul>
<h3>FIFO</h3><ul class="pro"><li>Muy simple: una cola de páginas en orden de carga.</li></ul><ul class="con"><li>Ignora el uso: puede desalojar una página muy usada.</li><li>Sufre la anomalía de Belady.</li></ul>
<h3>LRU</h3><ul class="pro"><li>Buen rendimiento: aprovecha la localidad.</li><li>No sufre la anomalía de Belady.</li></ul><ul class="con"><li>Costoso: hay que registrar el momento de cada acceso (hardware especial o aproximaciones como el reloj).</li></ul>
<h3>LFU</h3><ul class="pro"><li>Conserva páginas usadas intensamente.</li></ul><ul class="con"><li>Una página muy usada en el pasado puede quedar para siempre aunque ya no se use.</li><li>Penaliza a las recién cargadas (empiezan en 0), que suelen ser las próximas en usarse.</li></ul>
<h3>Reloj (complementario)</h3><ul class="pro"><li>Aproximación eficiente de LRU con un solo bit por página.</li></ul><ul class="con"><li>Si todas tienen R = 1 degenera en FIFO.</li></ul>`}
};

function checkAns(v, ans, f) {
  const s = String(v).trim().toLowerCase().replace(/\s+/g, " ");
  if (!s) return false;
  const alts = Array.isArray(ans) ? ans : [ans];
  return alts.some(a => {
    if (typeof a === "number") {
      const num = Number(s.replace(/\./g, "").replace(",", "."));
      return Number.isFinite(num) && Math.abs(num - a) <= (f.tol || 0);
    }
    const norm = x => String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
    return norm(s) === norm(a);
  });
}

    // brazo (actuador lineal simplificado) a la derecha, cabeza a 0°
    const trackR = t => rOut - t * rw - rw / 2;
    const armTrack = ph >= 3 ? target.pista : S5.prevTrack;
    const headX = cx + trackR(armTrack);
    const arm = Sv("g", { style: "transition:transform .9s cubic-bezier(.45,.05,.3,1)" });
    arm.append(Sv("rect", { x: 0, y: cy - 4, width: W, height: 8, fill: C.ink2, opacity: .85 }));
    arm.append(Sv("path", { d: `M0 ${cy - 9}L-9 ${cy}L0 ${cy + 9}Z`, fill: ph >= 3 ? C.foco : C.ink }));
    svg.append(arm);
    svg.append(Sv("text", { x: W - 6, y: cy + 22, "text-anchor": "end", "font-size": 10.5, fill: C.ink2, text: "brazo y cabeza" }));
    svg.append(Sv("text", { x: 8, y: Hh - 10, "font-size": 11, fill: C.ink, class: "mono", text: `cabeza en pista ${armTrack}` }));
    // rotación: el sector objetivo pasa por la cabeza (ángulo 0)
    const centerA = (-90 + (target.sector + .5) * 360 / S);
    let want = ph >= 4 ? -centerA : S5.rot;
    if (ph >= 4) { const cur = S5.rot; want = cur + ((((want - cur) % 360) + 360) % 360); }
    const fromRot = S5.rot, fromArm = S5.armR == null ? headX : S5.armR;
    plate.style.transform = `rotate(${fromRot}deg)`; arm.style.transform = `translateX(${fromArm}px)`;
    this.svgD = svg; this.disk.replaceChildren(svg);
    svg.getBoundingClientRect();
    requestAnimationFrame(() => { plate.style.transform = `rotate(${want}deg)`; arm.style.transform = `translateX(${headX}px)`; });
    S5.rot = want; S5.armR = headX;
    // secuencia de clusters: cambios de pista
    const sc = seqCost(seq, S, k, 0);
    const seqIn = h("input", { type: "text", value: S5.seq, style: "width:15rem;font-family:var(--mono)", onchange: e => { S5.seq = e.target.value; this.render(); } });
    this.below.replaceChildren(h("div", { class: "card", style: "margin-top:.7rem" },
      h("div", { class: "row", style: "justify-content:space-between" }, h("h3", {}, "Recorrer una secuencia de clusters"),
        h("div", { class: "row", style: "gap:.3rem" }, seqIn, ...SEQPRE.map(([n, v]) => h("button", { class: "btn" + (S5.seq === v ? " on" : ""), onclick: () => { S5.seq = v; this.render(); } }, n)))),
      h("div", { style: "overflow-x:auto" }, h("table", { class: "tbl", style: "margin-top:.4rem" },
        h("thead", {}, h("tr", {}, h("th", {}, "Cluster"), ...sc.rows.map(r => h("th", { class: "n" }, "C" + r.c)))),
        h("tbody", {}, h("tr", {}, h("td", {}, "Pista"), ...sc.rows.map(r => h("td", { class: "n" }, r.pista))),
          h("tr", {}, h("td", {}, "Sectores"), ...sc.rows.map(r => h("td", { class: "n" }, r.sec.join("–")))),
          h("tr", {}, h("td", {}, "Pistas que se mueve el brazo"), ...sc.rows.map(r => h("td", { class: "n" + (r.d ? " bad" : "") }, r.d)))))),
      h("p", { class: "small", style: "margin:.4rem 0 0" }, h("b", {}, `Cambios de pista: ${sc.changes} · desplazamiento total del brazo: ${sc.dist} pistas`), " (partiendo de la pista 0). Los clusters contiguos en el disco lógico quedan contiguos en el físico: por eso la asignación contigua minimiza las búsquedas.")));
  },
  concepto: `<p>La <b>organización física</b> traduce el <b>Disco Lógico</b> (una secuencia de clusters C0, C1, …) al <b>Disco Físico</b>: platos con <b>pistas</b> concéntricas divididas en <b>sectores</b>, la mínima unidad que el hardware lee o escribe.</p>
<p>Un <b>cluster</b> es un grupo de k sectores contiguos. Numerando los sectores en orden (pista 0 completa, luego pista 1…), el cluster C ocupa los sectores lógicos C·k … C·k + k − 1, y cada sector lógico L está en la pista ⌊L / S⌋, sector L mod S (S = sectores por pista). En discos con varias caras se agrega la cabeza (direccionamiento CHS); los discos actuales exponen directamente el número de sector lógico (LBA) y hacen la traducción en su controlador.</p>
<p>Leer un cluster cuesta: <b>búsqueda</b> (mover el brazo a la pista) + <b>latencia rotacional</b> (esperar el sector) + <b>transferencia</b>.</p>`,
  ventajas: `<h4>Cluster grande (k alto)</h4><ul><li class="pro">Menos clusters que administrar: tablas, mapas de bits e índices más chicos.</li><li class="pro">Más datos por cada búsqueda: mejor rendimiento secuencial.</li><li class="con">Más fragmentación interna en el último cluster de cada archivo.</li></ul>
<h4>Cluster chico (k bajo)</h4><ul><li class="pro">Menos desperdicio en archivos pequeños.</li><li class="con">Más punteros/entradas por archivo y más operaciones de E/S.</li></ul>
<h4>Contigüidad física</h4><ul><li class="pro">Clusters consecutivos quedan en la misma pista o en pistas vecinas: casi sin búsquedas.</li><li class="con">Archivos dispersos (encadenada, indexada) obligan al brazo a ir y venir.</li></ul>`,
  exercise(rng) {
    const S = pick(rng, [8, 12, 16, 20, 24, 32]), k = pick(rng, [1, 2, 4, 8]), c = rint(rng, 0, NLOG - 1), m = physMap(c, S, k), f = m.sectors[0];
    return {
      q: `Disco con <b>${S}</b> sectores por pista y clusters de <b>${k}</b> sector${k > 1 ? "es" : ""}. Pista 0 = exterior; sectores numerados desde 0. ¿Dónde está el cluster <b class="mono">C${c}</b>?`,
      fields: [{ label: "Primer sector lógico (LBA)", ans: f.L }, { label: "Pista", ans: f.pista }, { label: "Sector inicial dentro de la pista", ans: f.sector }],
      sol: [`LBA = ${c} × ${k} = <b>${f.L}</b>.`, `Pista = ⌊${f.L} / ${S}⌋ = <b>${f.pista}</b>.`, `Sector = ${f.L} mod ${S} = <b>${f.sector}</b>.`, `Ocupa: ${m.sectors.map(s => `pista ${s.pista} sector ${s.sector}`).join(", ")}.`]
    };
  }
};
