<template id="tpl-u5a"><style data-lab="u5a">
:root{
  --paper:#F6F1E7; --paper-2:#EFE7D8; --ink:#2A2420; --ink-2:#6B5F55; --rule:#D9CDB8;
  --so:#5E5A7A; --ocupado:#A0522D; --libre:#E8DFCC; --fallo:#B23A2E; --acierto:#4F6F52; --foco:#C08A2D; --disco:#7A6A58;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  font-size:15px;
}
body.proj{ --paper:#FCFAF5; --paper-2:#F4EEE3; --ink:#15110E; --ink-2:#40362E; --rule:#BFAF94; font-size:20px; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
.mono,code,kbd,table.data td,table.data th{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .row1{display:flex;align-items:baseline;gap:1rem;padding:.55rem 1.25rem .2rem}
.top h1{font-family:var(--serif);font-weight:600;font-size:1.32rem;margin:0;letter-spacing:.005em}
.top .sub{color:var(--ink-2);font-size:.82rem}
.top .tools{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.top nav{display:flex;gap:.1rem;padding:0 1rem .35rem;flex-wrap:wrap}
.top nav a{text-decoration:none;font-size:.86rem;padding:.25rem .6rem;border-bottom:2px solid transparent;color:var(--ink-2)}
.top nav a:hover{color:var(--ink)}
.top nav a.on{color:var(--ink);border-bottom-color:var(--foco);font-weight:500}
.top nav a .n{font-family:var(--mono);font-size:.78em;margin-right:.3em;color:var(--ink-2)}
.tbtn{border:1px solid var(--rule);background:var(--paper);padding:.2rem .6rem;border-radius:3px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.tbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn kbd{font-size:.72rem;opacity:.75;margin-left:.3rem}
#testflag{font-size:.75rem;color:var(--ink-2)}
#testflag.bad{color:var(--fallo);font-weight:600}
/* ---------- vistas ---------- */
main{padding:0 1.25rem}
.view{display:none;padding-top:.9rem}
.view.on{display:block}
.sec-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0}
.sec-head .lead{margin:0;color:var(--ink-2);font-size:.92rem;max-width:62rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:1.25rem;align-items:start}
body.proj .layout{grid-template-columns:minmax(0,1fr)}
body.proj .side, body.proj footer, body.proj .secondary{display:none!important}
.stage{min-width:0}
.panel{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:.6rem .75rem}
.params{display:flex;flex-wrap:wrap;gap:.45rem 1.1rem;align-items:center;margin-bottom:.6rem;font-size:.86rem}
.params label{display:flex;align-items:center;gap:.4rem;color:var(--ink-2)}
.params input[type=number],.params input[type=text],.params select{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:.15rem .35rem;color:var(--ink)}
.params input[type=number]{width:5.2rem;font-family:var(--mono)}
.params input[type=range]{accent-color:var(--foco);width:9rem}
.params output{font-family:var(--mono);color:var(--ink);min-width:3.2rem;display:inline-block}
.btn{border:1px solid var(--ink-2);background:var(--paper);padding:.18rem .65rem;border-radius:3px;cursor:pointer;font-size:.84rem}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.prim{background:var(--ink);color:var(--paper)}
.btn.prim:hover{background:#000}
.btn:disabled{opacity:.4;cursor:default}
.diagram{background:var(--paper);border:1px solid var(--rule);border-radius:4px;position:relative}
.diagram svg{display:block;width:100%;height:auto;max-height:calc(100vh - 14rem)}
body.proj .diagram svg{max-height:calc(100vh - 12rem)}
.svgtools{position:absolute;right:.4rem;top:.35rem;display:flex;gap:.3rem;opacity:0;transition:opacity .2s}
.diagram:hover .svgtools,.svgtools:focus-within{opacity:1}
.svgtools button{font-size:.72rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);padding:.08rem .45rem;border-radius:3px;cursor:pointer}
.svgcode{display:none;margin-top:.4rem}
.svgcode.on{display:block}
.svgcode textarea{width:100%;height:8rem;font-family:var(--mono);font-size:.72rem;background:var(--paper);border:1px solid var(--rule);color:var(--ink)}
/* barra de pasos */
.stepbar{display:flex;align-items:flex-start;gap:.75rem;margin-top:.6rem;padding:.55rem .75rem;border:1px solid var(--rule);border-left:4px solid var(--foco);background:var(--paper-2);border-radius:3px}
.stepbar .ctr{display:flex;gap:.25rem;flex-shrink:0}
.stepbar .ctr button{width:2.1rem;height:2rem;border:1px solid var(--rule);background:var(--paper);border-radius:3px;cursor:pointer;font-size:.85rem;line-height:1}
.stepbar .ctr button.wide{width:auto;padding:0 .55rem;font-size:.78rem}
.stepbar .ctr button:hover{border-color:var(--ink)}
.stepbar .no{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap;padding-top:.3rem}
.stepbar .cap{margin:0;font-size:.95rem;line-height:1.45;padding-top:.15rem}
.stepbar{position:sticky;bottom:0;z-index:4;box-shadow:0 -6px 12px -8px rgba(42,36,32,.25)}
.stepbar.err{border-left-color:var(--fallo)}
.stepbar.ok{border-left-color:var(--acierto)}
.cap b.f{color:var(--fallo)} .cap b.a{color:var(--acierto)}
/* panel lateral */
.side{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;position:sticky;top:6.2rem;max-height:calc(100vh - 7rem);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tabs button{flex:1 1 auto;background:none;border:0;border-bottom:2px solid transparent;padding:.45rem .4rem;font-size:.8rem;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panes{overflow:auto;padding:.75rem .95rem 1rem;font-size:.9rem}
.pane{display:none}
.pane.on{display:block}
.pane h3{font-family:var(--serif);font-size:1.05rem;margin:.2rem 0 .4rem;font-weight:600}
.pane h4{font-size:.86rem;margin:.8rem 0 .3rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.pane p{margin:.35rem 0 .6rem}
.pane ul{margin:.3rem 0 .6rem;padding-left:1.1rem}
.pane li{margin:.2rem 0}
.pane .pro li::marker{content:"+  ";color:var(--acierto);font-weight:700}
.pane .con li::marker{content:"−  ";color:var(--fallo);font-weight:700}
ol.steplist{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol.steplist li{counter-increment:s;padding:.35rem .4rem .35rem 2.2rem;position:relative;border-radius:3px;cursor:pointer;font-size:.84rem;line-height:1.4}
ol.steplist li::before{content:counter(s);position:absolute;left:.4rem;top:.38rem;font-family:var(--mono);font-size:.75rem;color:var(--ink-2);width:1.4rem;text-align:right}
ol.steplist li:hover{background:var(--paper)}
ol.steplist li.cur{background:var(--paper);box-shadow:inset 3px 0 0 var(--foco)}
ol.steplist li.err::before{color:var(--fallo)}
/* ejercicios */
.ex-prompt{background:var(--paper);border:1px solid var(--rule);padding:.55rem .7rem;border-radius:3px;margin-bottom:.6rem}
.ex-q{display:grid;grid-template-columns:1fr 6.5rem 1.6rem;gap:.4rem;align-items:center;margin:.3rem 0;font-size:.86rem}
.ex-q input{font-family:var(--mono);border:1px solid var(--rule);background:var(--paper);padding:.15rem .3rem;border-radius:3px;width:100%}
.ex-q .res{font-family:var(--mono);font-weight:600;text-align:center}
.ex-q .res.a{color:var(--acierto)} .ex-q .res.f{color:var(--fallo)}
.ex-btns{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
ol.ex-sol{padding-left:1.2rem;font-size:.85rem}
ol.ex-sol li{margin:.3rem 0}
/* tablas */
table.data{border-collapse:collapse;font-size:.8rem;width:100%}
table.data th{background:var(--ink);color:var(--paper);font-weight:600;padding:.25rem .45rem;text-align:center;font-family:var(--sans)}
table.data td{border-bottom:1px solid var(--rule);padding:.18rem .45rem;text-align:center}
table.data td.pname{font-family:var(--sans);font-weight:600;border-right:1px solid var(--rule);background:var(--paper)}
table.data tr.hl td:not(.pname){background:var(--foco);color:#fff}
table.data tr.dim td:not(.pname){color:var(--ink-2)}
.tblwrap{max-height:27rem;overflow:auto;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.tblwrap table.data th{position:sticky;top:0}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-.05em;margin-right:.3em}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;padding:.05rem .4rem;border-radius:2px;font-weight:600;font-family:var(--sans)}
.tag.so{background:var(--so);color:#fff}
.tag.hw{background:var(--disco);color:#fff}
.metrics{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.84rem;margin-top:.45rem}
.metrics b{font-family:var(--mono);font-weight:600}
.metrics .f{color:var(--fallo)}
/* partición dinámica */
.dyn-grid{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:.8rem;align-items:start}
.evq{list-style:none;margin:0;padding:0;font-size:.82rem;max-height:17rem;overflow:auto;border:1px solid var(--rule);background:var(--paper);border-radius:3px}
.evq li{display:flex;align-items:center;gap:.4rem;padding:.2rem .45rem;border-bottom:1px solid var(--rule);cursor:pointer}
.evq li .k{font-family:var(--mono);color:var(--ink-2);width:1.3rem;text-align:right;font-size:.75rem}
.evq li .t{flex:1}
.evq li .t .mono{font-size:.8rem}
.evq li.done{color:var(--ink-2)}
.evq li.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--foco);color:var(--ink)}
.evq li button{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:.9rem;padding:0 .2rem}
.evq li button:hover{color:var(--fallo)}
.evadd{display:grid;grid-template-columns:4.4rem minmax(0,1fr) 3.8rem auto;gap:.25rem;margin-top:.35rem}
.evadd select,.evadd input{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:.1rem .25rem;font-size:.8rem;min-width:0}
.evadd input{font-family:var(--mono)}
.mini-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin:.7rem 0 .25rem;font-weight:600}
table.algcmp{font-size:.78rem}
table.algcmp td{text-align:left}
table.algcmp tr.sel td{font-weight:600;background:var(--paper)}
/* paginación */
.pg-grid{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,14rem) minmax(0,1fr);gap:.8rem;align-items:start}
.pg-grid > div > .ttl, .seg-grid .ttl{font-family:var(--serif);font-style:italic;font-size:.95rem;margin:0 0 .25rem}
#d-pg-proc svg{max-width:20rem;margin:0 auto}
.xlate{display:flex;flex-wrap:wrap;align-items:stretch;gap:.35rem;margin-top:.6rem}
.xlate .chip{border:1px solid var(--rule);background:var(--paper);padding:.35rem .55rem;border-radius:3px;font-size:.82rem;min-width:7rem;opacity:.35;transition:opacity .25s}
.xlate .chip.on{opacity:1}
.xlate .chip.cur{border-color:var(--foco);box-shadow:inset 0 -3px 0 var(--foco)}
.xlate .chip.err{border-color:var(--fallo);color:var(--fallo)}
.xlate .chip .v{font-family:var(--mono);font-size:1.05rem;font-weight:600;display:block}
.xlate .arr{align-self:center;color:var(--ink-2);font-family:var(--mono)}
.bits{font-family:var(--mono);font-size:1.05rem;letter-spacing:.08em;display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-top:.2rem}
.bits span{padding:.05rem .35rem}
.bits .pg{background:var(--ocupado);color:#fff}
.bits .of{background:var(--libre)}
.bitslbl{display:flex;font-size:.68rem;color:var(--ink-2);gap:.6rem}
.whowho{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;margin-top:.5rem;color:var(--ink-2)}
/* segmentación */
.seg-grid{display:grid;grid-template-columns:minmax(0,16rem) minmax(0,15rem) minmax(0,1fr);gap:.8rem;align-items:start;margin-top:.6rem}
/* objetivos */
.obj-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:.4rem 0 1rem}
.obj{border:1px solid var(--rule);border-top:3px solid var(--ink);background:var(--paper-2);padding:.8rem 1rem;border-radius:3px}
.obj .num{font-family:var(--mono);color:var(--ink-2);font-size:.8rem}
.obj h3{font-family:var(--serif);font-size:1.12rem;margin:.15rem 0 .4rem;font-weight:600;line-height:1.3}
.obj p{font-size:.88rem;margin:.3rem 0 .6rem;color:var(--ink)}
.obj ul{list-style:none;padding:0;margin:0;font-size:.86rem}
.obj li{border-top:1px solid var(--rule);padding:.3rem 0}
.obj li a{text-decoration:none;font-weight:500}
.obj li a:hover{text-decoration:underline}
.obj li span{display:block;color:var(--ink-2);font-size:.8rem}
.cmp td{text-align:left!important;font-family:var(--sans)!important;font-size:.82rem}
footer{border-top:1px solid var(--rule);margin:1.6rem 1.25rem 0;padding:.7rem 0 1.2rem;font-size:.8rem;color:var(--ink-2)}
footer cite{font-style:italic}
.note{font-size:.8rem;color:var(--ink-2)}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .pg-grid,.seg-grid{grid-template-columns:1fr 1fr}
  .obj-grid{grid-template-columns:1fr}
}

<!-- ======================= OBJETIVOS ======================= -->
<section class="view" id="v-objetivos" data-sec="objetivos">
  <div class="sec-head"><h2>Objetivos de la administración de memoria</h2>
  <p class="lead">El SO abstrae la complejidad del hardware y administra y protege los recursos. La memoria principal es uno de ellos: estos son los tres objetivos de la cátedra y dónde se trabaja cada uno en el laboratorio.</p></div>
  <div class="layout">
    <div class="stage">
      <div class="obj-grid">
        <div class="obj"><div class="num">Objetivo 1</div><h3>Simplificar (y abstraer) el uso de la memoria a los usuarios</h3>
          <p>Cada proceso ve su imagen como si empezara en 0 B; no necesita saber en qué lugar de la RAM quedó cargado.</p>
          <ul><li><a href="#imagen">1 · Imagen del proceso</a><span>0..X B del proceso vs 0..N B de la RAM</span></li>
              <li><a href="#reubicacion">2 · Dirección relativa y reubicación</a><span>registro base: 600 + 123 = 723</span></li>
              <li><a href="#paginacion">5 · Paginación</a><span>traducción página → marco por hardware</span></li></ul></div>
        <div class="obj"><div class="num">Objetivo 2</div><h3>Optimizar el uso de la memoria principal de la computadora</h3>
          <p>Cargar la mayor cantidad de procesos desperdiciando lo menos posible: fragmentación interna y externa.</p>
          <ul><li><a href="#particion-fija">4 · Partición fija</a><span>fragmentación interna</span></li>
              <li><a href="#particion-dinamica">3 · Partición dinámica</a><span>fragmentación externa, algoritmos de ubicación, compactación</span></li>
              <li><a href="#paginacion">5 · Paginación</a><span>fragmentación interna mínima, sin externa</span></li></ul></div>
        <div class="obj"><div class="num">Objetivo 3</div><h3>Permitir proteger los datos y compartir datos</h3>
          <p>Que ningún proceso acceda fuera de lo suyo y, a la vez, que dos procesos puedan usar la misma información.</p>
          <ul><li><a href="#reubicacion">2 · Reubicación</a><span>registro límite: protección básica</span></li>
              <li><a href="#segmentacion">6 · Segmentación + Paginación</a><span>atributos por segmento y segmento compartido</span></li>
              <li><a href="#paginacion">5 · Paginación</a><span>cada proceso con su tabla de páginas</span></li></ul></div>
      </div>
      <div class="diagram" id="d-objetivos"></div>
      <div class="mini-h" style="margin-top:1rem">Comparación de los métodos de organizar la memoria</div>
      <table class="data cmp">
        <thead><tr><th>Método</th><th>Unidad de asignación</th><th>¿Contigua?</th><th>Fragmentación</th><th>Traducción de direcciones</th></tr></thead>
        <tbody>

    concepto: `<h3>Partición fija</h3>
<p>La memoria se divide de antemano, al iniciar el sistema, en <b>particiones de límites fijos</b>. Cada partición aloja <b>un único proceso</b> de tamaño menor o igual al suyo.</p>
<p><b>Igual tamaño</b> (clase): 640 B en tres particiones con límites en 213 B y 426 B. SO (84 B) en la primera → sobran 129 B; P1 (176 B) en la segunda → sobran 37 B. Ese espacio sobrante dentro de una partición ocupada es la <b>fragmentación interna</b>. P2 (350 B) es más grande que cualquier partición (214 B como máximo) y no puede cargarse.</p>

  paginacion: {
    concepto: `<h3>Paginación</h3>
<p>La memoria principal se divide en <b>marcos</b> (frames) de igual tamaño, y la imagen de cada proceso en <b>páginas</b> del mismo tamaño: <b>Página = 20 B = Marco</b>. Cada página se carga en <b>cualquier marco libre</b>: la imagen ya no necesita ser contigua.</p>
<p>P1 (176 B) → 9 páginas (P0..P8); la última usa 16 B y deja <b>4 B libres</b>: fragmentación interna <b>mínima</b>, nunca mayor que una página por proceso. No hay fragmentación externa: cualquier marco libre sirve. La RAM de 640 B tiene 640 / 20 = <b>32 marcos</b>.</p>

<p><span class="tag so">Sistema operativo</span> administra páginas y marcos: lleva la lista de marcos libres y una <b>tabla de páginas por proceso</b> (página → marco).</p>

    vyd: `<h3>Paginación</h3>

<ul class="con"><li>Cada proceso necesita su tabla de páginas, que ocupa memoria.</li>

  segmentacion: {
    concepto: `<h3>Segmentación + Paginación</h3>
<p>La <b>segmentación</b> divide la imagen del proceso en <b>segmentos</b> de tamaño variable que corresponden a partes lógicas del programa (código, datos, pila…). Combinada con paginación, cada segmento se divide a su vez en <b>páginas</b> que se cargan en marcos.</p>
<p><span class="tag so">Sistema operativo</span> mantiene por proceso una <b>tabla de segmentos</b> (tamaño y <b>atributos</b>: lectura, escritura, ejecución) y una <b>tabla de páginas</b> por segmento.</p>
<p><span class="tag hw">Hardware</span> traduce: la dirección relativa es (nro de segmento, desplazamiento). Verifica que el desplazamiento no supere el tamaño del segmento y que los atributos permitan la operación; luego calcula nro de página y desplazamiento y obtiene el nro de marco: <b>nro segmento + nro página → nro marco</b>.</p>
<h4>Proteger y compartir</h4>
<p>Cada segmento tiene sus propios permisos (por ejemplo, código sólo lectura/ejecución). Dos procesos pueden <b>compartir</b> un segmento haciendo que sus tablas apunten a los mismos marcos, incluso con atributos distintos para cada uno.</p>`,
    vyd: `<h3>Segmentación + Paginación</h3>

<li>Compartir ahorra memoria: un único juego de marcos para varios procesos.</li></ul>
<ul class="con"><li>Dos tablas y dos consultas por traducción: más hardware y más memoria para tablas.</li>
<li>Fragmentación interna en la última página de <i>cada</i> segmento.</li>
<li>Mayor complejidad del SO.</li></ul>`

<script>
IASO.def("u5b", function(){

'use strict';
/* =====================================================================
   NÚCLEO: funciones puras (entrada, paso) -> estado completo.
   Nada de este bloque toca el DOM.
   ===================================================================== */
const ALGO_NAMES = {OPT:'Óptimo', FIFO:'FIFO', LRU:'LRU', LFU:'LFU', CLOCK:'Reloj (2ª oportunidad)'};
const EXTRA_COL = {OPT:'Próximo uso', FIFO:'Tiempo Carga', LRU:'Tiempo Último Acceso', LFU:'Cantidad de Accesos', CLOCK:'Bit R'};

function splitAddress(addr, ps){
  const page = Math.floor(addr/ps), base = page*ps;
  return {addr, page, base, offset: addr-base, lo: base, hi: base+ps-1};
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isPow2(n){ return n>0 && (n & (n-1))===0; }
function log2(n){ return Math.round(Math.log2(n)); }

/* Ejemplo de la cátedra (diapositivas "Ejemplo del funcionamiento de los algoritmos") */
function classConfig(){
  const table = [];
  for(let p=0;p<9;p++) table.push({page:p, present:false, frame:null, load:null, last:null, count:null});
  Object.assign(table[2], {present:true, frame:7,  load:3, last:3, count:0});
  Object.assign(table[5], {present:true, frame:22, load:2, last:2, count:1});
  Object.assign(table[6], {present:true, frame:10, load:1, last:1, count:1});
  return {pageSize:1024, numPages:9, frames:3, mode:'addr', table, addrs:[6582,455,6011,6588,2222,5123], pageRefs:[]};
}
function emptyConfig(pageRefs, k){
  const n = Math.max(1, ...pageRefs) + 1, table = [];
  for(let p=0;p<n;p++) table.push({page:p, present:false, frame:null, load:null, last:null, count:null});
  return {pageSize:1024, numPages:n, frames:k, mode:'pages', table, addrs:[], pageRefs:pageRefs.slice()};
}

function validateCfg(cfg){
  const e = [];
  if(!(cfg.pageSize>0)) e.push('El tamaño de página debe ser positivo.');
  if(!(cfg.numPages>0 && cfg.numPages<=64)) e.push('La cantidad de páginas debe estar entre 1 y 64.');
  if(!(cfg.frames>0 && cfg.frames<=16)) e.push('La cantidad de marcos asignados debe estar entre 1 y 16.');
  const pres = cfg.table.filter(r=>r.present);
  if(pres.length > cfg.frames) e.push(`La tabla inicial tiene ${pres.length} páginas presentes pero el proceso tiene sólo ${cfg.frames} marcos asignados.`);
  const fr = new Set();
  pres.forEach(r=>{
    if(!(Number.isInteger(r.frame) && r.frame>=0)) e.push(`La página ${r.page} figura presente pero no tiene un número de marco válido.`);
    else if(fr.has(r.frame)) e.push(`El marco ${r.frame} está asignado a dos páginas.`);
    fr.add(r.frame);
    if(!(Number.isInteger(r.load) && r.load>=0)) e.push(`La página ${r.page} necesita un Tiempo de Carga (número ≥ 0).`);
  });
  const refs = cfg.mode==='addr' ? cfg.addrs : cfg.pageRefs;
  if(!refs.length) e.push('No hay referencias para simular.');
  if(refs.length>40) e.push('Máximo 40 referencias.');
  refs.forEach(a=>{
    if(!(Number.isInteger(a) && a>=0)) e.push(`Referencia inválida: ${a}.`);
    else {
      const p = cfg.mode==='addr' ? Math.floor(a/cfg.pageSize) : a;
      if(p>=cfg.numPages) e.push(cfg.mode==='addr' ? `La dirección ${a} cae en la página ${p}, fuera del espacio del proceso (0–${cfg.numPages-1}).` : `La página ${a} no existe (el proceso tiene páginas 0–${cfg.numPages-1}).`);
    }
  });
  return [...new Set(e)];
}

function buildRefs(cfg){
  if(cfg.mode==='addr') return cfg.addrs.map(a=>splitAddress(a, cfg.pageSize));
  return cfg.pageRefs.map(p=>({addr:null, page:p, offset:null, base:null, lo:null, hi:null}));
}

function extraValue(algo, e){
  if(!e) return null;
  if(algo==='FIFO') return 'T'+e.load;
  if(algo==='LRU') return 'T'+e.last;
  if(algo==='LFU') return e.count;
  if(algo==='CLOCK') return e.r;
  return null;
}

/* Simulación completa. Devuelve {refs, t0, states[], steps[], faults}
   states[0] = estado inicial; states[i+1] = estado luego de la referencia i. */
function simulate(cfg, algo){
  const refs = buildRefs(cfg);
  const pres = cfg.table.filter(r=>r.present);
  let res = pres.map(r=>({page:r.page, frame:r.frame, load:r.load, last:(r.last ?? r.load), count:(r.count ?? 0), r:1}));
  const t0 = (pres.length ? Math.max(...pres.map(r=>Math.max(r.load, r.last ?? r.load))) : 0) + 1;
  const used = new Set(res.map(r=>r.frame));
  const free = [];
  for(let f=0; free.length < cfg.frames - res.length; f++) if(!used.has(f)) free.push(f);
  const ring = res.slice().sort((a,b)=>a.load-b.load || a.page-b.page).map(r=>r.frame).concat(free);
  let ptr = 0;
  const hist = [];
  for(let p=0;p<cfg.numPages;p++){
    const e = res.find(r=>r.page===p);
    hist.push({pres:[!!e], frame:[e?e.frame:null], extra:[extraValue(algo,e)]});
  }
  const snap = (extra)=>Object.assign({res:clone(res), hist:clone(hist), free:free.slice(), ring:ring.slice(), ptr}, extra||{});
  const states = [snap()], steps = [];
  const pushX = (p,v)=>{ const h=hist[p].extra; if(h[h.length-1]!==v) h.push(v); };

  refs.forEach((ref, i)=>{
    const t = t0+i, p = ref.page;
    const st = Object.assign({i, t, tl:'T'+t}, ref);
    const e = res.find(r=>r.page===p);
    if(e){
      st.hit = true; st.fault = false; st.frame = e.frame;
      e.last = t; e.count++; e.r = 1;
      if(algo!=='OPT' && algo!=='FIFO') pushX(p, extraValue(algo, e));
    } else {
      st.hit = false; st.fault = true;
      let frame;
      if(free.length){
        frame = free.shift(); st.usedFree = true;
      } else {
        const v = chooseVictim(algo, res, refs, i, ring, ptr);
        st.victim = {page:v.victim.page, frame:v.victim.frame};
        if(algo==='OPT') v.candidates.forEach(c=>c.label = c.next===Infinity ? 'no se vuelve a usar (∞)' : `T${t0+c.next} (dentro de ${c.dist})`);
        st.candidates = v.candidates; st.tie = v.tie; st.scan = v.scan;
        if(algo==='CLOCK'){
          v.scan.forEach(s=>{ if(s.cleared){ const ce=res.find(r=>r.page===s.page); ce.r=0; pushX(s.page,0); } });
          ptr = v.ptr;
        }
        frame = v.victim.frame;
        res = res.filter(r=>r!==v.victim);
        const hv = hist[v.victim.page];
        hv.pres.push(false); hv.frame.push(null);
        if(algo!=='OPT') hv.extra.push(null);
      }
      const ne = {page:p, frame, load:t, last:t, count:0, r:1};
      res.push(ne);
      if(algo==='CLOCK') ptr = (ring.indexOf(frame)+1) % ring.length;
      st.frame = frame;
      const hp = hist[p];
      hp.pres.push(true); hp.frame.push(frame);
      if(algo!=='OPT') hp.extra.push(extraValue(algo, ne));
    }
    st.phys = ref.offset!=null ? st.frame*cfg.pageSize + ref.offset : null;
    st.text = stepText(cfg, algo, st);
    steps.push(st);
    states.push(snap());
  });
  return {cfg, algo, refs, t0, states, steps, faults: steps.filter(s=>s.fault).length};
}

function nextUse(refs, i, page){
  for(let j=i+1;j<refs.length;j++) if(refs[j].page===page) return j;
  return Infinity;
}

function chooseVictim(algo, res, refs, i, ring, ptr){
  if(algo==='CLOCK'){
    const scan = []; let q = ptr, guard = 0;
    const rr = res.map(r=>({...r}));
    while(guard++ < 64){
      const fr = ring[q]; const e = rr.find(r=>r.frame===fr);
      if(e.r===1){ scan.push({page:e.page, frame:fr, r:1, cleared:true}); e.r=0; q=(q+1)%ring.length; }
      else { scan.push({page:e.page, frame:fr, r:0, cleared:false, chosen:true}); break; }
    }
    const vp = scan[scan.length-1].page;
    return {victim: res.find(r=>r.page===vp), candidates:null, tie:null, scan, ptr:q};
  }
  const cand = res.map(r=>{
    const c = {page:r.page, frame:r.frame, load:r.load, last:r.last, count:r.count};
    if(algo==='FIFO'){ c.key=r.load; c.label='T'+r.load; }
    if(algo==='LRU'){ c.key=r.last; c.label='T'+r.last; }
    if(algo==='LFU'){ c.key=r.count; c.label=String(r.count); }
    if(algo==='OPT'){ const j=nextUse(refs,i,r.page); c.next=j; c.dist = j===Infinity?Infinity:j-i; c.key = -c.dist; }
    return c;
  });
  const best = Math.min(...cand.map(c=>c.key));
  let pool = cand.filter(c=>c.key===best), tie = null;
  if(pool.length>1){
    const pages = pool.map(c=>c.page).sort((a,b)=>a-b);
    const lb = Math.min(...pool.map(c=>c.last));
    pool = pool.filter(c=>c.last===lb);
    if(pool.length>1){ const ld=Math.min(...pool.map(c=>c.load)); pool=pool.filter(c=>c.load===ld); }
    pool.sort((a,b)=>a.page-b.page);
    tie = {pages, rule:'LRU', chosen:pool[0].page};
  }
  const vp = pool[0].page;
  cand.forEach(c=>c.chosen = c.page===vp);
  return {victim: res.find(r=>r.page===vp), candidates:cand, tie};
}

function stepText(cfg, algo, s){
  let t = `${s.tl}: `;
  if(s.addr!=null){
    t += `la dirección ${s.addr} pertenece a la página ${s.page} (${s.lo} B–${s.hi} B); desplazamiento ${s.addr} − ${s.base} = ${s.offset}. `;
  } else t += `se referencia la página ${s.page}. `;
  if(s.hit){
    t += `Está presente en el marco ${s.frame} → acierto.`;
    if(s.phys!=null) t += ` Dirección absoluta = ${s.frame} × ${cfg.pageSize} + ${s.offset} = ${s.phys}.`;
    if(algo==='LRU') t += ` Se actualiza su Tiempo Último Acceso a ${s.tl}.`;
    if(algo==='LFU') t += ` Su Cantidad de Accesos aumenta en 1.`;
    if(algo==='CLOCK') t += ` Se pone su bit R en 1.`;
    return t;
  }
  t += 'No está presente → fallo de página. ';
  if(s.usedFree){ t += `Hay un marco libre asignado al proceso: el SO carga la página ${s.page} en el marco ${s.frame}.`; return t; }
  const v = s.victim;
  if(algo==='FIFO') t += `FIFO reemplaza la página cargada hace más tiempo: la página ${v.page} (Tiempo Carga ${s.candidates.find(c=>c.chosen).label}).`;
  if(algo==='LRU') t += `LRU reemplaza la página usada hace más tiempo: la página ${v.page} (último acceso ${s.candidates.find(c=>c.chosen).label}).`;
  if(algo==='LFU') t += `LFU reemplaza la página con menos accesos: la página ${v.page} (${s.candidates.find(c=>c.chosen).label} accesos).`;
  if(algo==='OPT'){
    if(s.tie) t += `Óptimo: las páginas ${s.tie.pages.join(' y ')} no se vuelven a usar (empate); se desempata por LRU y se reemplaza la página ${v.page}.`;
    else t += `Óptimo reemplaza la página cuyo próximo uso está más lejos: la página ${v.page}.`;
  }
  if(algo==='CLOCK'){
    const cl = s.scan.filter(x=>x.cleared).map(x=>x.page);
    const again = cl.includes(v.page);
    t += (cl.length? `El puntero da segunda oportunidad a ${cl.length>1?'las páginas':'la página'} ${cl.join(', ')} (R=1→0)` : 'El puntero') + (again ? `, y tras dar la vuelta completa, vuelve a la página ${v.page}, ahora con R=0: es la víctima.` : `${cl.length?' y':''} encuentra la página ${v.page} con R=0: es la víctima.`);
  }
  if(s.tie && algo!=='OPT') t += ` (Empate entre ${s.tie.pages.join(' y ')}; desempate por LRU.)`;
  t += ` Se carga la página ${s.page} en el marco ${s.frame}.`;
  return t;
}

/* Cadenas de referencia de páginas (vista clásica, Belady, gráficos) */
function simulateString(pages, k, algo){ return simulate(emptyConfig(pages, k), algo); }
function faultsVsFrames(pages, algo, kmax){
  const out = [];
  for(let k=1;k<=kmax;k++) out.push(simulateString(pages, k, algo).faults);
  return out;
}
function parseList(s){
  return String(s).split(/[\s,;]+/).filter(Boolean).map(x=>/^-?\d+$/.test(x)?parseInt(x,10):NaN);
}

/* Contenido de cada marco (para la grilla clásica): fila = marco, columna = estado */
function gridData(sim){
  const frames = [...new Set(sim.states[0].ring)].sort((a,b)=>a-b);
  const cols = sim.states.map((st, j)=>{
    const m = {}; st.res.forEach(r=>m[r.frame]=r);
    return frames.map(f=>m[f] ? {page:m[f].page, r:m[f].r} : null);
  });
  return {frames, cols};
}

/* ---------------- Sección 1: imagen del proceso ---------------- */
const IMG_PAGES = [
  {id:'PCB', part:'PCB', c:'--c-pizarra'},
  {id:'D0', part:'Datos', c:'--c-oliva'},{id:'D1', part:'Datos', c:'--c-oliva'},
  {id:'I0', part:'Instrucciones', c:'--c-terracota'},{id:'I1', part:'Instrucciones', c:'--c-terracota'},{id:'I2', part:'Instrucciones', c:'--c-terracota'},
  {id:'P0', part:'Pila', c:'--c-mostaza'},{id:'P1', part:'Pila', c:'--c-mostaza'}];
function ideaSim(labels, k, withVM){
  const ids = IMG_PAGES.map(p=>p.id);
  const refs = labels.map(l=>ids.indexOf(l));
  if(!withVM){
    return {fits: k>=ids.length, refs, labels, states:null};
  }
  const sim = simulateString(refs, k, 'LRU');
  return {fits:true, refs, labels, sim};
}

/* ---------------- Sección 2: P1 de 176 B ---------------- */
const PAG = {size:176, ps:20, frames:[0,2,7,8,17,22,10,15,20], present:[2,5,6], ramFrames:32, cols:4};
function pagTranslate(addr, withVM){
  const s = splitAddress(addr, PAG.ps);
  const frame = PAG.frames[s.page];
  const present = !withVM || PAG.present.includes(s.page);
  return Object.assign(s, {frame, present, phys: present ? frame*PAG.ps + s.offset : null});
}

/* ---------------- Sección 3: traducción con bit de presencia ---------------- */
function translateSteps(addr, ps, table, freePool){
  const s = splitAddress(addr, ps);
  const row = table[s.page];
  const out = [];
  const base = {addr, ps, page:s.page, offset:s.offset};
  const bits = isPow2(ps) ? log2(ps) : null;
  if(!row){ out.push(Object.assign({k:'err', text:`La dirección ${addr} cae en la página ${s.page}, que no pertenece a P1 (páginas 0–${table.length-1}): el hardware genera una excepción de protección y el SO aborta el acceso.`}, base)); return out; }
  out.push(Object.assign({k:'in', text:`El proceso genera la dirección relativa (o virtual) ${addr}.`}, base));
  out.push(Object.assign({k:'split', text:`HARDWARE: divide la dirección en Nro Página = ${addr} div ${ps} = ${s.page} y Desplazamiento = ${addr} mod ${ps} = ${s.offset}`+(bits?` (los ${bits} bits bajos son el desplazamiento).`:'.')}, base));
  out.push(Object.assign({k:'look', text:`HARDWARE: indexa la tabla de páginas de P1 en la fila ${s.page} y consulta el bit ¿Presente? → ${row.present?'Sí':'No'}.`, present:row.present}, base));
  if(row.present){
    out.push(Object.assign({k:'ok', frame:row.frame, phys:row.frame*ps+s.offset, text:`HARDWARE: Presente. Reemplaza el Nro Página por el Nro Marco ${row.frame}: dirección absoluta (o real) = ${row.frame} × ${ps} + ${s.offset} = ${row.frame*ps+s.offset}.`}, base));
    return out;
  }
  const f = freePool.length ? freePool[0] : null;
  out.push(Object.assign({k:'fault', text:`HARDWARE: No presente → fallo de página. Se genera una interrupción (trap) y el control pasa al SISTEMA OPERATIVO; el proceso queda bloqueado.`}, base));
  if(f==null){ out.push(Object.assign({k:'nofree', text:'SISTEMA OPERATIVO: no quedan marcos libres en este ejemplo: habría que elegir una víctima con un algoritmo de reemplazo (ver sección 6). Restaurá la tabla para seguir probando.'}, base)); return out; }
  out.push(Object.assign({k:'load', frame:f, text:`SISTEMA OPERATIVO: localiza la página ${s.page} en el disco, toma el marco libre ${f} y ordena la lectura (E/S). Mientras tanto la CPU ejecuta otro proceso.`}, base));
  out.push(Object.assign({k:'upd', frame:f, text:`SISTEMA OPERATIVO: al terminar la E/S actualiza la tabla: página ${s.page} → ¿Presente? = Sí, Marco = ${f}. El proceso vuelve a Listo.`}, base));
  out.push(Object.assign({k:'retry', frame:f, phys:f*ps+s.offset, text:`HARDWARE: se reintenta la misma instrucción. Ahora la página está presente: dirección absoluta = ${f} × ${ps} + ${s.offset} = ${f*ps+s.offset}.`}, base));
  return out;
}

/* ---------------- Sección 4: traza con localidad ---------------- */
function lcg(seed){ let s = seed>>>0; return ()=>{ s = (Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function makeTrace(){
  const R = lcg(20251);
  // fases: regiones (bytes) que se usan juntas; espacio de 16 KB
  const phases = [
    {n:34, regs:[[0,1500,6],[9200,9900,3],[15600,16380,1]]},
    {n:30, regs:[[1500,3000,6],[9200,10200,3],[15600,16380,1]]},
    {n:36, regs:[[4100,5800,6],[12000,12900,3],[15300,16380,1]]},
    {n:28, regs:[[6200,7400,6],[12300,13300,4]]},
    {n:34, regs:[[300,1700,6],[9500,10100,3],[15600,16380,1]]},
    {n:38, regs:[[7400,8600,5],[13000,14300,4],[15600,16380,1]]},
  ];
  const out = []; const bounds = [];
  phases.forEach(ph=>{
    bounds.push(out.length);
    const tot = ph.regs.reduce((a,r)=>a+r[2],0);
    for(let i=0;i<ph.n;i++){
      let x = R()*tot, reg = ph.regs[0];
      for(const r of ph.regs){ if(x < r[2]){ reg=r; break; } x -= r[2]; }
      out.push(Math.floor(reg[0] + R()*(reg[1]-reg[0])));
    }
  });
  return {addrs:out, bounds, space:16384};
}
function workingSet(pages, t, delta){
  const s = new Set();
  for(let j=Math.max(0,t-delta+1); j<=t; j++) s.add(pages[j]);
  return [...s].sort((a,b)=>a-b);
}
/* Asignación variable por conjunto de trabajo: fallo si la página no está en W(t-1, Δ) */
function wsPolicy(pages, delta){
  let faults = 0, sum = 0, max = 0;
  pages.forEach((p,t)=>{
    const prev = t>0 ? workingSet(pages, t-1, delta) : [];
    if(!prev.includes(p)) faults++;
    const w = workingSet(pages, t, delta).length; sum += w; max = Math.max(max, w);
  });
  return {faults, avg: sum/pages.length, max};
}

/* ---------------- Sección 5: políticas ---------------- */
function fetchSim(refs, policy, block, nPages){
  const loaded = new Set(), usedSet = new Set(), steps = [];
  let faults = 0, ops = 0, pagesLoaded = 0;
  refs.forEach((p,i)=>{
    const st = {i, page:p, fault:false, loaded:[]};
    if(!loaded.has(p)){
      st.fault = true; faults++; ops++;
      const add = [p];
      if(policy==='pre') for(let q=p+1; q<p+block && q<nPages; q++) if(!loaded.has(q)) add.push(q);
      add.forEach(q=>loaded.add(q)); pagesLoaded += add.length; st.loaded = add;
    }
    usedSet.add(p);
    st.inRam = [...loaded].sort((a,b)=>a-b); st.used = [...usedSet];
    steps.push(st);
  });
  const unused = [...loaded].filter(q=>!usedSet.has(q)).length;
  return {steps, faults, ops, pagesLoaded, unused};
}

/* Línea de tiempo de un fallo de página según la política de limpieza.
   Unidades: ms. Lectura = escritura = 8 ms; mover a la lista del buffer ≈ 0,5 ms. */
function cleaningTimeline(policy, dirty, reref){
  const RD = 8, WR = 8, ev = []; let blocked = 0, crit = 0, total = 0;
  const T2 = 30;
  if(policy==='demanda'){
    let t = 0;
    if(dirty){ ev.push({lane:'disco', a:0, b:WR, k:'w', l:'escribe víctima'}); t = WR; crit++; }
    ev.push({lane:'disco', a:t, b:t+RD, k:'r', l:'lee página'}); crit++;
    ev.push({lane:'proc', a:0, b:t+RD, k:'blk', l:'bloqueado'}); blocked += t+RD;
    if(reref){ ev.push({lane:'disco', a:T2, b:T2+RD, k:'r', l:'relee víctima'}); ev.push({lane:'proc', a:T2, b:T2+RD, k:'blk', l:'nuevo fallo'}); blocked += RD; crit++; }
  }
  if(policy==='pre'){
    if(dirty){ ev.push({lane:'disco', a:-14, b:-6, k:'wb', l:'escritura anticipada'}); }
    ev.push({lane:'disco', a:0, b:RD, k:'r', l:'lee página'}); crit++;
    ev.push({lane:'proc', a:0, b:RD, k:'blk', l:'bloqueado'}); blocked += RD;
    if(reref){ ev.push({lane:'disco', a:T2, b:T2+RD, k:'r', l:'relee víctima'}); ev.push({lane:'proc', a:T2, b:T2+RD, k:'blk', l:'nuevo fallo'}); blocked += RD; crit++; }
  }
  if(policy==='buffer'){
    ev.push({lane:'so', a:0, b:0.8, k:'buf', l:dirty?'víctima → lista de modificadas':'víctima → lista de libres'});
    ev.push({lane:'disco', a:0, b:RD, k:'r', l:'lee página'}); crit++;
    ev.push({lane:'proc', a:0, b:RD, k:'blk', l:'bloqueado'}); blocked += RD;
    if(dirty) ev.push({lane:'disco', a:16, b:16+WR, k:'wb', l:'escritura en lote'});
    if(reref){ ev.push({lane:'so', a:T2, b:T2+0.8, k:'buf', l:'se recupera del buffer'}); ev.push({lane:'proc', a:T2, b:T2+0.8, k:'blk', l:''}); blocked += 0.8; }
  }
  total = ev.filter(e=>e.lane==='disco').length;
  return {ev, blocked, crit, total};
}

/* Alcance del reemplazo: local (asignación fija por proceso) vs global. LRU en ambos casos. */
function scopeSim(refs, scope, alloc){
  const nF = alloc.P1 + alloc.P2;
  const frames = Array.from({length:nF}, (_,f)=>({f, owner: f<alloc.P1?'P1':'P2', page:null, proc:null, last:-1}));
  const steps = [], faults = {P1:0, P2:0};
  refs.forEach((r,i)=>{
    const st = {i, proc:r.proc, page:r.page};
    let fr = frames.find(x=>x.proc===r.proc && x.page===r.page);
    if(fr){ st.hit = true; fr.last = i; st.frame = fr.f; }
    else {
      st.hit = false; faults[r.proc]++;
      const pool = scope==='local' ? frames.filter(x=>x.owner===r.proc) : frames;
      let target = pool.find(x=>x.page===null);
      if(!target){ target = pool.reduce((a,b)=> b.last < a.last ? b : a); st.victim = {proc:target.proc, page:target.page}; }
      target.proc = r.proc; target.page = r.page; target.last = i; st.frame = target.f;
    }
    st.frames = clone(frames); st.faults = {...faults};
    steps.push(st);
  });
  return {steps, faults};
}
function parseScopeRefs(s){
  return String(s).split(/[\s,;]+/).filter(Boolean).map(tok=>{
    const m = /^P?([12])[:.](\d+)$/i.exec(tok);
    return m ? {proc:'P'+m[1], page:parseInt(m[2],10)} : null;
  });
}

const Sound = {
  on:false, ctx:null,
  ensure(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } return this.ctx; },
  play(kind){
    if(!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    try{
      if(kind==='step'){ // clic de tecla suave: ruido filtrado muy corto
        const b = c.createBuffer(1, c.sampleRate*0.03, c.sampleRate), d = b.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
        const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=1.2;
        const g=c.createGain(); g.gain.value=0.22; s.connect(f).connect(g).connect(c.destination); s.start(t);
      } else if(kind==='fault'){ // golpe sordo grave
        const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+0.22);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.35);
      } else if(kind==='hit'){ // tic seco
        const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=1650;
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.06);
      }
    }catch(e){}
  }
};

/* ---------- Controlador de pasos ---------- */
class Stepper{
  constructor(el, opts){
    this.el = el; this.i = 0; this.n = 0; this.timer = null; this.opts = opts;
    el.innerHTML = `<button data-a="reset" title="Reiniciar (R)">&#8634;</button><button data-a="prev" title="Paso anterior (←)">&#9664;</button><button data-a="play" title="Reproducir / pausa (espacio)">&#9655;</button><button data-a="next" title="Paso siguiente (→)">&#9654;</button><span class="pos"></span><span class="prog"><i></i></span><span class="hint secondary">← → espacio R</span>`;
    el.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; Sound.ensure(); this[b.dataset.a](); });
  }
  setCount(n){ this.n = n; if(this.i>n) this.i=n; this.paint(); }
  set(i, quiet){ const j = Math.max(0, Math.min(this.n, i)); const changed = j!==this.i; this.i=j; this.paint(); this.opts.onChange(this.i, quiet); if(changed && !quiet) this.opts.sound && this.opts.sound(this.i); }
  next(){ if(this.i>=this.n){ this.stop(); return; } this.set(this.i+1); }
  prev(){ this.set(this.i-1); }
  reset(){ this.stop(); this.set(0); }
  play(){ if(this.timer){ this.stop(); return; } if(this.i>=this.n) this.set(0, true); this.timer = setInterval(()=>{ if(this.i>=this.n) this.stop(); else this.next(); }, this.opts.interval||1400); this.paint(); }
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } this.paint(); }
  paint(){
    const pb = this.el.querySelector('[data-a=play]'); pb.innerHTML = this.timer ? '&#10074;&#10074;' : '&#9655;';
    const lbl = this.opts.label ? this.opts.label(this.i) : `${this.i} / ${this.n}`;
    this.el.querySelector('.pos').textContent = lbl;
    this.el.querySelector('.prog i').style.width = (this.n? 100*this.i/this.n : 0)+'%';
    const hidden = this.opts.hidden && this.opts.hidden();
    this.el.style.display = hidden ? 'none' : '';
  }
}

  if(kind==='ids') return v.split(/[\s,;]+/).filter(Boolean).sort().join(',');

}

const S4 = {

    this.recompute();

  recompute(){
    this.pages = this.trace.addrs.map(a=>Math.floor(a/this.ps));
    this.curves = {FIFO:faultsVsFrames(this.pages,'FIFO',12), LRU:faultsVsFrames(this.pages,'LRU',12), OPT:faultsVsFrames(this.pages,'OPT',12)};
    this.sizes = [256,512,1024,2048,4096].map(ps=>{ const pg=this.trace.addrs.map(a=>Math.floor(a/ps)); const k=Math.max(1,Math.floor(4096/ps)); return {ps, k, distinct:new Set(pg).size, faults:simulateString(pg,k,'LRU').faults}; });
    this.stepper.setCount(this.pages.length-1); this.render();
  },
  steps(){
    const b = this.trace.bounds, N=this.pages.length;
    const names = ['bucle inicial + datos globales + pila','segunda parte del bucle + otra zona de datos','rutina distinta: nuevo código y nuevos datos','otra rutina (sin pila)','vuelve al código inicial','rutina final con nueva zona de datos'];
    return b.map((t,j)=>({k:`t=${t}`, at:t+Math.min(10,(b[j+1]??N)-t-1), text:`Fase ${j+1} (t ${t}–${(b[j+1]??N)-1}): ${names[j]}. Las referencias se concentran en pocas páginas.`}));

function histHTML(arr, prevLen, fmt){
  const last = arr.length-1, parts = [];
  const changed = arr.length > prevLen && arr.length>1;
  let struck = [];
  arr.forEach((v,j)=>{ if(j<last && v!=null) struck.push(v); });
  if(struck.length>3){ parts.push('<span class="st">…</span>'); struck = struck.slice(-3); }
  struck.forEach(v=>parts.push(`<span class="st">${fmt(v)}</span>`));
  const v = arr[last];
  if(v!=null) parts.push(`<span class="${changed?'newv':''}">${fmt(v)}</span>`);
  else if(!parts.length) parts.push('-');
  return parts.join('');
}

function gridSVG(sim, upto, o={}){
  readColors();
  const g = gridData(sim), n = sim.states.length, cw = o.compact?34:48, lw = o.compact?58:76, rh = o.compact?24:30, hh = o.compact?40:46;
  const W = lw + n*cw + 6, H = hh + g.frames.length*rh + (o.compact?26:32);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:${W*(o.scale||1)}px;max-width:100%" role="img" aria-label="Grilla de reemplazo ${ALGO_NAMES[sim.algo]}">`;
  s += `<style>.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}text{font-family:Inter,system-ui,sans-serif}</style>`;
  s += R(0,0,W,H,`fill="${C.paper}"`);
  const fs = o.compact?11:13;
  s += T(lw-8, hh-26, 'ref.', `text-anchor="end" font-size="10" fill="${C['ink-2']}"`);
  for(let j=0;j<n;j++){
    const x = lw + j*cw, on = j<=upto, st = j>0 ? sim.steps[j-1] : null;
    if(j===upto && j>0) s += R(x,2,cw,H-4,`fill="${C.foco}" fill-opacity=".13"`);
    s += T(x+cw/2, hh-26, j===0?'Inicial':st.tl, `text-anchor="middle" class="m" font-size="${o.compact?9:10}" fill="${C['ink-2']}"`);
    if(st) s += T(x+cw/2, hh-10, st.page, `text-anchor="middle" class="m" font-size="${fs+1}" font-weight="700" fill="${on?C.ink:C['ink-2']}" ${on?'':'opacity=".45"'}`);
    g.frames.forEach((f,r)=>{
      const y = hh + r*rh; const c = g.cols[j][r];
      const isNew = st && st.fault && st.frame===f && on;
      s += R(x+1,y+1,cw-2,rh-2,`fill="${!on?C.paper:(isNew?C.foco:(c?C['paper-2']:'url(#hatch)'))}" stroke="${C.rule}"`);
      if(on && c) s += T(x+cw/2, y+rh/2+fs/2-1, c.page + (sim.algo==='CLOCK' && c.r?'*':''), `text-anchor="middle" class="m" font-size="${fs}" font-weight="${isNew?700:400}" fill="${C.ink}"`);
    });
    if(st && on){ const y = hh + g.frames.length*rh + (o.compact?16:20); s += T(x+cw/2, y, st.fault?'F':'A', `text-anchor="middle" class="m" font-size="${fs}" font-weight="700" fill="${st.fault?C.fallo:C.acierto}"`); }
  }
  g.frames.forEach((f,r)=>{ s += T(lw-8, hh + r*rh + rh/2+4, sim.cfg.mode==='addr'||sim.cfg.table.some(t=>t.present)?`Marco ${f}`:`Marco ${f}`, `text-anchor="end" class="m" font-size="${o.compact?9:11}" fill="${C['ink-2']}"`); });
  s += `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="${C.libre}"/><line x1="0" y1="0" x2="0" y2="7" stroke="${C.disco}" stroke-opacity=".28" stroke-width="1.2"/></pattern></defs>`;
  return s + '</svg>';
}

function clockSVG(sim, k){
  const st = sim.states[k], ring = st.ring, n = ring.length, cx=95, cy=80, r=58;
  let s = `<svg viewBox="0 0 190 165" style="width:190px" role="img" aria-label="Reloj">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.rule}" stroke-width="1.5"/>`;
  ring.forEach((f,j)=>{ const a = -Math.PI/2 + 2*Math.PI*j/n, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); const e = st.res.find(q=>q.frame===f);
    s += `<circle cx="${x}" cy="${y}" r="20" fill="${e?C.ocupado:C.libre}" stroke="${C.paper}" stroke-width="2"/>`;
    s += T(x,y-1, e?('p'+e.page):'—', `text-anchor="middle" class="m" font-size="11" fill="${e?'#FBF6EE':C['ink-2']}"`);
    s += T(x,y+11, e?('R='+e.r):'', `text-anchor="middle" class="m" font-size="9" fill="#FBF6EE"`);
  });
  const a = -Math.PI/2 + 2*Math.PI*st.ptr/n;
  s += `<line x1="${cx}" y1="${cy}" x2="${cx+(r-24)*Math.cos(a)}" y2="${cy+(r-24)*Math.sin(a)}" stroke="${C.foco}" stroke-width="3" marker-end="url(#ahF)"/><circle cx="${cx}" cy="${cy}" r="4" fill="${C.foco}"/>`;
  s += T(cx, 160, 'puntero del reloj', `text-anchor="middle" font-size="10" fill="${C['ink-2']}"`);
  return s.replace('role="img"', 'role="img"') + defs() + '</svg>';
}

const S6 = {
  id:'algoritmos', algo:'OPT', view:'tabla', cfg:classConfig(), sim:null, isClass:true,
  belady:{str:'1 2 3 4 1 2 5 1 2 3 4 5', k:3},
  init(){
    $('#algSel').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; this.algo=b.dataset.v; $$('#algSel button').forEach(x=>x.classList.toggle('on',x===b)); this.recompute(true); App.refreshPanels(); });
    $('#algView').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; this.view=b.dataset.v; $$('#algView button').forEach(x=>x.classList.toggle('on',x===b)); this.stepper.paint(); this.render(); App.refreshPanels(); });
    $('#algCfgBtn').onclick = ()=>{ const on = !$('#algCfg').classList.contains('on'); $('#algCfg').classList.toggle('on', on); $('#algCfgBtn').setAttribute('aria-pressed', on); if(on) this.buildCfg(); };
    this.stepper = new Stepper($('[data-stepper=algoritmos]'), {onChange:()=>this.render(), interval:1600, hidden:()=>this.view==='belady',
      sound:i=>{ const st=this.sim.steps[i-1]; if(st) Sound.play(st.fault?'fault':'hit'); else Sound.play('step'); },
      label:i=>i===0?'estado inicial':`${this.sim.steps[i-1].tl} · ${i} / ${this.sim.steps.length}`});
    this.recompute();
  },
  setCfg(cfg, isClass){ this.cfg = cfg; this.isClass = !!isClass; this.recompute(); if($('#algCfg').classList.contains('on')) this.buildCfg(); },
  recompute(keep){
    this.sim = simulate(this.cfg, this.algo);
    this.all = {}; ['OPT','FIFO','LRU','LFU','CLOCK'].forEach(a=>this.all[a] = a===this.algo ? this.sim : simulate(this.cfg, a));
    const i = keep ? this.stepper.i : 0;
    this.stepper.setCount(this.sim.steps.length); this.stepper.set(Math.min(i, this.sim.steps.length), true);
    const c = this.cfg;
    $('#algSub').textContent = this.isClass ? 'Ejemplo de la cátedra · P1 · página 1 KB · asignación fija (3 marcos) · reemplazo local, búsqueda y limpieza por demanda'
      : `Modo libre · ${c.mode==='addr'?`página ${c.pageSize} B · `:'cadena de páginas · '}asignación fija (${c.frames} marcos) · reemplazo local, búsqueda y limpieza por demanda`;
  },
  steps(){
    if(this.view==='belady') return [{k:'—', text:'Vista sin pasos: compará las grillas y el gráfico.'}];
    const s0 = this.cfg.table.filter(r=>r.present);
    const out = [{k:'inicio', text: s0.length ? `Estado inicial: páginas presentes ${s0.map(r=>`${r.page} (marco ${r.frame})`).join(', ')}.` : `Estado inicial: los ${this.cfg.frames} marcos asignados están vacíos.`}];
    if(this.view==='comp') this.sim.steps.forEach((st,j)=>out.push({k:st.tl, text:`${st.tl} (pág ${st.page}): ` + ['OPT','FIFO','LRU','LFU'].map(a=>{ const x=this.all[a].steps[j]; return `${ALGO_NAMES[a]} ${x.fault?'F'+(x.victim?` (sale ${x.victim.page})`:''):'A'}`; }).join(' · ')}));
    else this.sim.steps.forEach(st=>out.push({k:st.tl, text:st.text}));
    return out;
  },
  render(){
    readColors();
    const el = $('#algMain'), k = this.stepper.i;
    if(this.view==='tabla') el.innerHTML = this.renderTabla(k);
    if(this.view==='grilla') el.innerHTML = `<div class="stage">${gridSVG(this.sim, k, {scale:document.body.classList.contains('proj')?1.7:1.25})}<div class="note" style="margin-top:6px">Vista clásica: cada columna es una referencia, cada fila un marco asignado; la celda resaltada es la página recién cargada. F = fallo, A = acierto.${this.algo==='CLOCK'?' * = bit R en 1.':''}</div></div>`;
    if(this.view==='comp') el.innerHTML = this.renderComp(k);
    if(this.view==='belady') el.innerHTML = this.renderBelady();
    if(this.view==='tabla') $$('.reflist .ri', el).forEach(d=>d.onclick=()=>this.stepper.set(+d.dataset.i+1));
    if(this.view==='belady'){ const go=()=>{ this.belady.str=$('#belStr').value; this.belady.k=Math.max(1,Math.min(8,+$('#belK').value||3)); this.render(); App.refreshPanels(); }; $('#belStr').onchange=go; $('#belK').onchange=go; $('#belLoad').onclick=()=>{ const r=parseList(this.belady.str); if(r.every(Number.isInteger)){ this.algo='FIFO'; $$('#algSel button').forEach(x=>x.classList.toggle('on',x.dataset.v==='FIFO')); this.view='grilla'; $$('#algView button').forEach(x=>x.classList.toggle('on',x.dataset.v==='grilla')); this.setCfg(emptyConfig(r,this.belady.k)); this.render(); App.refreshPanels(); } }; }
    const st = k>0 ? this.sim.steps[k-1] : null;
    if(this.view==='belady') $('#capAlg').innerHTML = this.belCap || '';
    else if(this.view==='comp') $('#capAlg').innerHTML = esc(this.steps()[k].text);
    else $('#capAlg').innerHTML = st ? esc(st.text) : esc(this.steps()[0].text) + ' Avanzá con ▶ o con la flecha derecha.';
    this.stepper.paint();
    App.afterRender(this);
  },
  renderTabla(k){
    const sim = this.sim, cfg = this.cfg, st = sim.states[k], prev = k>0 ? sim.states[k-1] : st, step = k>0 ? sim.steps[k-1] : null;
    const algo = this.algo, addr = cfg.mode==='addr';
    // lista de direcciones
    let L = `<div class="reflist"><div class="note" style="margin-bottom:6px">${addr?'Direcciones Lógicas solicitadas por P1:':'Páginas referenciadas por P1:'}</div>`;
    sim.steps.forEach((s,j)=>{
      const done = j<k, cur = j===k-1;
      L += `<div class="ri ${cur?'cur':''} ${done||cur?'':'fut'}" data-i="${j}"><span class="t">${s.tl})</span><span class="a">${addr?s.addr:'pág '+s.page}</span>`;
      L += `<div class="d"># Pág.: ${s.page}${done?` <span class="arrow">→</span> ${s.hit?'<span class="pr">Presente</span>':'<span class="np">No Presente</span>'} <span class="arrow">→</span> # Marco: ${s.frame}`:''}</div>`;
      if(addr) L += `<div class="d">Desplazamiento: ${s.offset}</div>`;
      L += `</div>`;
    });
    L += `</div>`;
    // marcos
    const frames = [...st.ring].sort((a,b)=>a-b);
    let F = `<div class="framestrip"><div class="note" style="align-self:center;margin-right:4px">Marcos asignados<br>a P1:</div>`;
    frames.forEach(f=>{ const e = st.res.find(r=>r.frame===f); const isNew = step && step.fault && step.frame===f;
      F += `<div class="fbox ${e?(isNew?'new':'occ'):'empty'} ${isNew&&step.victim?'vic':''}"><div class="fh">Marco ${f}${addr?` · ${f*cfg.pageSize} B`:''}</div><div class="fp">${e?'pág '+e.page:'libre'}</div></div>`; });
    F += `</div>`;
    // tabla
    const xh = EXTRA_COL[algo];
    let Tb = `<table class="pt"><thead><tr><th class="arr" style="background:transparent"></th><th>Página</th><th>¿Presente?</th><th>Marco</th><th>${xh.replace(' Último ',' Último<br>').replace('Cantidad de ','Cantidad de<br>')}</th>${addr?'<th class="rng" style="background:transparent"></th>':''}</tr></thead><tbody>`;
    for(let p=0;p<cfg.numPages;p++){
      const h = st.hist[p], hp = prev.hist[p];
      const isCur = step && step.page===p, isVic = step && step.victim && step.victim.page===p;
      let extra;
      if(algo==='OPT'){
        const e = st.res.find(r=>r.page===p);
        if(!e) extra='-'; else { const j = nextUse(sim.refs, k-1, p); extra = j===Infinity ? '∞' : `T${sim.t0+j}`; }
      } else extra = histHTML(h.extra, k>0?hp.extra.length:h.extra.length, v=>algo==='CLOCK'?v:String(v));
      Tb += `<tr class="${isCur?'cur':''} ${isVic?'vic':''}"><td class="arr">${isCur?ARROW(C.foco):isVic?ARROW(C.fallo):''}</td><td>${p}</td>`;
      Tb += `<td>${histHTML(h.pres, k>0?hp.pres.length:h.pres.length, v=>v?'<span class="yes">Sí</span>':'No')}</td>`;
      Tb += `<td>${histHTML(h.frame, k>0?hp.frame.length:h.frame.length, v=>v)}</td><td>${extra}</td>`;
      if(addr){ const lo=p*cfg.pageSize, hi=lo+cfg.pageSize-1; Tb += `<td class="rng">${lo} B – ${hi} B${isCur?` <b style="color:var(--foco)">← ${step.addr}</b>`:''}</td>`; }
      Tb += `</tr>`;
    }
    Tb += `</tbody></table>`;
    if(algo==='OPT') Tb += `<div class="note" style="margin-top:4px">Próximo uso: referencia futura más cercana de cada página presente (∞ = no se vuelve a usar en la cadena).</div>`;
    if(algo==='CLOCK') Tb += `<div class="note" style="margin-top:4px">Complementario. Se asume R = 1 al cargar una página; el puntero recorre los marcos en orden de carga.</div>`;
    // detalle
    let D = `<div class="detail">`;
    if(!step){
      D += this.isClass ? `<b>Consideraciones:</b> Tamaño de la Página 1 KB (1024 bytes) · Asignación Fija (3 marcos) · Reemplazo Local con Búsqueda y Limpieza por Demanda.` : `<b>Configuración:</b> ${addr?`página de ${cfg.pageSize} B · `:''}${cfg.frames} marcos asignados · ${sim.steps.length} referencias.`;
      if(algo==='OPT') D += `<br>Óptimo: ante un empate (varias páginas que no se vuelven a usar) se desempata por LRU.`;
      if(algo==='LFU') D += `<br>LFU: una página recién cargada empieza con 0 accesos; ante empate se desempata por LRU.`;
    } else {
      D += `<div class="row"><span class="chip ${step.fault?'F':'A'}">${step.fault?'F':'A'}</span>`;
      if(addr) D += `<span class="mono">${step.tl}) ${step.addr} ∈ [${step.lo} B – ${step.hi} B] → # Pág. ${step.page} · Desplazamiento = ${step.addr} − ${step.base} = ${step.offset}</span>`;
      else D += `<span class="mono">${step.tl}) página ${step.page}</span>`;
      D += `</div><div class="row" style="margin-top:4px">${step.fault?'<b style="color:var(--fallo)">No Presente</b> → fallo de página':'<b style="color:var(--acierto)">Presente</b>'} → # Marco ${step.frame}${step.phys!=null?` · Dirección absoluta = ${step.frame} × ${cfg.pageSize} + ${step.offset} = <b class="mono">${step.phys}</b>`:''}</div>`;
      if(step.candidates){
        D += `<table><tr><th>Candidata</th><th>Marco</th><th>${algo==='OPT'?'Próximo uso':xh}</th>${(step.tie)?'<th>Último acceso</th>':''}<th></th></tr>`;
        step.candidates.forEach(c=>{ D += `<tr class="${c.chosen?'pick':''}"><td>pág ${c.page}</td><td>${c.frame}</td><td>${c.label}</td>${step.tie?`<td>${step.tie.pages.includes(c.page)?'T'+c.last:''}</td>`:''}<td>${c.chosen?'víctima':''}</td></tr>`; });
        D += `</table>`;
        if(step.tie) D += `<div style="margin-top:4px"><b>Empate</b> entre las páginas ${step.tie.pages.join(' y ')}: se desempata por <b>LRU</b> (la de acceso más antiguo) → se reemplaza la página ${step.tie.chosen}.</div>`;
      }
      if(step.scan){ D += `<div style="margin-top:4px">Recorrido del puntero: ${step.scan.map(x=>`pág ${x.page} (R=${x.r}${x.cleared?'→0':''})`).join(' → ')}</div>`; }
      if(step.usedFree) D += `<div style="margin-top:4px">Marco libre disponible: no hace falta reemplazar (el fallo igual cuenta).</div>`;
    }
    D += `<div class="row" style="margin-top:6px"><span class="note">Fallos hasta ${step?step.tl:'el inicio'}: <b class="mono">${sim.steps.slice(0,k).filter(x=>x.fault).length}</b> · total de la cadena con ${ALGO_NAMES[algo]}: <b class="mono">${sim.faults}</b></span></div></div>`;
    const clock = algo==='CLOCK' ? `<div style="display:flex;gap:12px;align-items:flex-start">${clockSVG(sim,k)}<div style="flex:1">${F}</div></div>` : F;
    return `<div class="alg-wrap">${L}<div style="min-width:0">${clock}${Tb}${D}</div></div>`;
  },
  renderComp(k){
    const algos = ['OPT','FIFO','LRU','LFU'];
    const mx = Math.max(...algos.map(a=>this.all[a].faults), this.all.CLOCK.faults, 1);
    let bars = `<div class="stage" style="margin-bottom:12px"><div class="note" style="margin-bottom:6px">Fallos de página en toda la cadena (misma configuración inicial)</div>`;
    [...algos,'CLOCK'].forEach(a=>{ const f=this.all[a].faults; bars += `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.84rem"><span style="width:150px">${ALGO_NAMES[a]}${a==='CLOCK'?' <span class="badge-comp">compl.</span>':''}</span><span style="display:inline-block;height:14px;width:${Math.max(2,320*f/mx)}px;background:${a==='CLOCK'?C.disco:C.ocupado}"></span><b class="mono">${f}</b></div>`; });
    bars += `</div>`;
    let cards = `<div class="compare">`;
    algos.forEach(a=>{ cards += `<div class="cmpcard"><h4>${ALGO_NAMES[a]}<span class="num">${this.all[a].steps.slice(0,k).filter(x=>x.fault).length} / ${this.all[a].faults} fallos</span></h4>${gridSVG(this.all[a], k, {compact:true})}</div>`; });
    return bars + cards + `</div>`;
  },
  renderBelady(){
    const r = parseList(this.belady.str); const k = this.belady.k;
    let h = `<div class="ctrls"><label>Cadena de referencias <input type="text" id="belStr" value="${esc(this.belady.str)}" size="30"></label><label>Marcos <input type="number" id="belK" min="1" max="8" value="${k}"></label><button class="btn sm" id="belLoad">Abrir en la vista de pasos</button><span class="badge-comp">Complementario</span></div>`;
    if(!r.length || r.some(x=>!(Number.isInteger(x)&&x>=0&&x<64))){ this.belCap='Cadena inválida: usá números de página separados por espacios.'; return h; }
    const a = simulateString(r,k,'FIFO'), b = simulateString(r,k+1,'FIFO');
    const curves = {FIFO:faultsVsFrames(r,'FIFO',8), LRU:faultsVsFrames(r,'LRU',8), OPT:faultsVsFrames(r,'OPT',8)};
    h += `<div class="flexrow"><div class="cmpcard"><h4>FIFO con ${k} marcos<span class="num">${a.faults} fallos</span></h4>${gridSVG(a, a.steps.length, {compact:true})}</div>`;
    h += `<div class="cmpcard"><h4>FIFO con ${k+1} marcos<span class="num">${b.faults} fallos</span></h4>${gridSVG(b, b.steps.length, {compact:true})}</div></div>`;
    // gráfico fallos vs marcos
    const W=560, H=220, X0=50, X1=W-150, Y0=20, Y1=H-36; const mf = Math.max(...curves.FIFO, ...curves.LRU);
    const sx = q=>X0+(X1-X0)*(q-1)/7, sy = v=>Y1-(Y1-Y0)*v/mf;
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%">`;
    s += L(X0,Y1,X1,Y1,`stroke="${C['ink-2']}"`)+L(X0,Y0,X0,Y1,`stroke="${C['ink-2']}"`);
    for(let q=1;q<=8;q++) s += T(sx(q),Y1+14,q,`text-anchor="middle" class="m" font-size="10" fill="${C['ink-2']}"`);
    for(let v=0; v<=mf; v+=2) s += T(X0-6,sy(v)+3,v,`text-anchor="end" class="m" font-size="10" fill="${C['ink-2']}"`)+L(X0,sy(v),X1,sy(v),`stroke="${C.rule}" stroke-width=".6"`);
    s += T((X0+X1)/2,H-4,'cantidad de marcos',`text-anchor="middle" font-size="11" fill="${C['ink-2']}"`);
    [['FIFO',C.ocupado,''],['LRU',C.so,'6 3'],['OPT',C.acierto,'2 3']].forEach(([al,col,da],j)=>{ const v=curves[al];
      s += P('M'+v.map((y,q)=>`${sx(q+1)},${sy(y)}`).join(' L'),`fill="none" stroke="${col}" stroke-width="2.2" stroke-dasharray="${da}"`);
      v.forEach((y,q)=>{ s += `<circle cx="${sx(q+1)}" cy="${sy(y)}" r="3" fill="${col}"/>`; });
      s += L(X1+20,Y0+10+j*18,X1+44,Y0+10+j*18,`stroke="${col}" stroke-width="2.2" stroke-dasharray="${da}"`)+T(X1+50,Y0+14+j*18,al==='OPT'?'Óptimo':al,`font-size="11" fill="${C.ink}"`); });
    const anom = []; for(let q=1;q<8;q++) if(curves.FIFO[q]>curves.FIFO[q-1]) anom.push(q);
    anom.forEach(q=>{ s += `<circle cx="${sx(q+1)}" cy="${sy(curves.FIFO[q])}" r="8" fill="none" stroke="${C.fallo}" stroke-width="1.6"/>`; });
    s += `</svg>`;
    h += `<div class="stage" style="margin-top:12px"><div class="note">Fallos según la cantidad de marcos para esta cadena (círculo rojo: más marcos, más fallos)</div>${s}</div>`;
    this.belCap = b.faults>a.faults ? `<b>Anomalía de Belady:</b> con FIFO, pasar de ${k} a ${k+1} marcos <b>aumenta</b> los fallos de ${a.faults} a ${b.faults}. LRU y Óptimo son algoritmos "de pila": nunca empeoran al agregar marcos.` : `Con esta cadena FIFO no muestra la anomalía entre ${k} y ${k+1} marcos (${a.faults} → ${b.faults} fallos). Probá la cadena clásica 1 2 3 4 1 2 5 1 2 3 4 5 con 3 marcos.`;
    return h;
  },
  buildCfg(){
    const c = this.cfg, el = $('#algCfg');
    const refs = c.mode==='addr' ? c.addrs.join(' ') : c.pageRefs.join(' ');
    el.innerHTML = `<div class="grid"><div>
      <div class="ctrls" style="flex-direction:column;align-items:flex-start;gap:6px;margin:0">
        <label>Tamaño de página (B) <input type="number" id="cfPs" min="1" value="${c.pageSize}"></label>
        <label>Páginas del proceso <input type="number" id="cfN" min="1" max="64" value="${c.numPages}"></label>
        <label>Marcos asignados (fija) <input type="number" id="cfK" min="1" max="16" value="${c.frames}"></label>
        <div class="seg" id="cfMode"><button data-v="addr" class="${c.mode==='addr'?'on':''}">Direcciones lógicas</button><button data-v="pages" class="${c.mode==='pages'?'on':''}">Cadena de páginas</button></div>
        <label style="width:100%;flex-direction:column;align-items:flex-start">Referencias (separadas por espacio o coma)<textarea id="cfRefs">${esc(refs)}</textarea></label>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri sm" id="cfApply">Aplicar</button><button class="btn sm" id="cfClass">Ejemplo de la cátedra</button><button class="btn sm" id="cfEmpty">Vaciar memoria</button><button class="btn sm" id="cfBel">Cadena de Belady</button></div>
        <div class="errs" id="cfErr"></div>
      </div></div>
      <div style="overflow:auto;max-height:330px"><div class="note">Tabla de páginas inicial (los tiempos son números: 3 = T3)</div><table class="pt" id="cfTable"></table></div></div>`;
    let mode = c.mode;
    const rows = c.table.map(r=>({...r}));
    const drawTable = ()=>{
      const n = Math.max(1, Math.min(64, +$('#cfN').value||1));
      while(rows.length<n) rows.push({page:rows.length, present:false, frame:null, load:null, last:null, count:null});
      rows.length = n;
      $('#cfTable').innerHTML = `<tr><th>Página</th><th>¿Presente?</th><th>Marco</th><th>T Carga</th><th>T Últ. acceso</th><th>Accesos</th></tr>` + rows.map((r,p)=>`<tr><td>${p}</td><td><input type="checkbox" data-p="${p}" data-f="present" ${r.present?'checked':''}></td>${['frame','load','last','count'].map(f=>`<td><input type="number" min="0" data-p="${p}" data-f="${f}" value="${r[f]??''}" ${r.present?'':'disabled'}></td>`).join('')}</tr>`).join('');
      $$('#cfTable input').forEach(inp=>inp.onchange=()=>{ const p=+inp.dataset.p, f=inp.dataset.f; if(f==='present'){ rows[p].present=inp.checked; if(inp.checked){ const mx=Math.max(0,...rows.filter(r=>r.present&&r.load!=null).map(r=>r.load)); if(rows[p].load==null){ rows[p].load=mx+1; rows[p].last=mx+1; rows[p].count=0; } } drawTable(); } else rows[p][f] = inp.value===''?null:parseInt(inp.value,10); });
    };
    drawTable();
    $('#cfN').onchange = drawTable;
    $$('#cfMode button').forEach(b=>b.onclick=()=>{ mode=b.dataset.v; $$('#cfMode button').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#cfApply').onclick = ()=>{ $('#cfErr').innerHTML='';
      const cfg = {pageSize:+$('#cfPs').value, numPages:rows.length, frames:+$('#cfK').value, mode, table:rows.map((r,p)=>({page:p, present:r.present, frame:r.present?r.frame:null, load:r.present?r.load:null, last:r.present?(r.last??r.load):null, count:r.present?(r.count??0):null})), addrs:[], pageRefs:[]};
      const list = parseList($('#cfRefs').value); if(mode==='addr') cfg.addrs=list; else cfg.pageRefs=list;
      const errs = validateCfg(cfg);
      $('#cfErr').innerHTML = errs.map(esc).join('<br>');
      if(!errs.length){ this.setCfg(cfg, false); this.render(); App.refreshPanels(); $('#cfErr').innerHTML='<span style="color:var(--acierto)">Configuración aplicada.</span>'; }
    };
    $('#cfClass').onclick = ()=>{ this.setCfg(classConfig(), true); this.buildCfg(); this.render(); App.refreshPanels(); };
    $('#cfEmpty').onclick = ()=>{ rows.forEach(r=>{ r.present=false; r.frame=r.load=r.last=r.count=null; }); drawTable(); };
    $('#cfBel').onclick = ()=>{ this.setCfg(emptyConfig([1,2,3,4,1,2,5,1,2,3,4,5],3), false); this.buildCfg(); this.render(); App.refreshPanels(); };
  },
  exercise(el){
    const self = this;
    let algo = ['OPT','FIFO','LRU','LFU'].includes(this.algo) ? this.algo : 'FIFO', cfg, sim, revealed;
    const gen = ()=>{
      for(let tries=0; tries<200; tries++){
        const pres = shuffle([...Array(9).keys()]).slice(0,3), frames = shuffle([...Array(32).keys()]).slice(0,3), order = shuffle([1,2,3]);
        const table = []; for(let p=0;p<9;p++) table.push({page:p, present:false, frame:null, load:null, last:null, count:null});
        pres.forEach((p,j)=>Object.assign(table[p], {present:true, frame:frames[j], load:order[j], last:order[j], count:rnd(0,2)}));
        const others = shuffle([...Array(9).keys()].filter(p=>!pres.includes(p))).slice(0,2), pool = pres.concat(others);
        const addrs = Array.from({length:6}, ()=>{ const p = pool[rnd(0,pool.length-1)]; return p*1024 + rnd(0,1023); });
        const c = {pageSize:1024, numPages:9, frames:3, mode:'addr', table, addrs, pageRefs:[]};
        const f = simulate(c, algo).faults;
        if(f>=2 && f<=4){ cfg = c; break; }
      }
      sim = simulate(cfg, algo); revealed = 0; draw();
    };
    const draw = ()=>{
      const xh = EXTRA_COL[algo];
      const tbl = `<table class="pt"><tr><th>Pág.</th><th>¿Pres.?</th><th>Marco</th>${algo==='OPT'?'':`<th>${xh}</th>`}</tr>` + cfg.table.map(r=>`<tr><td>${r.page}</td><td>${r.present?'Sí':'No'}</td><td>${r.present?r.frame:'-'}</td>${algo==='OPT'?'':`<td>${r.present?(algo==='LFU'?r.count:'T'+(algo==='FIFO'?r.load:r.last)):'-'}</td>`}</tr>`).join('') + `</table>`;
      el.innerHTML = `<div class="ex"><h3>Ejercicio: algoritmos de reemplazo</h3>
        <div class="ctrls" style="margin:4px 0"><label>Algoritmo <select id="exAlg">${['OPT','FIFO','LRU','LFU'].map(a=>`<option value="${a}" ${a===algo?'selected':''}>${ALGO_NAMES[a]}</option>`).join('')}</select></label></div>
        <div class="stmt">Página 1 KB (1024 B) · asignación fija (3 marcos) · reemplazo local, búsqueda y limpieza por demanda.${algo==='OPT'||algo==='LFU'?' Empates: por LRU.':''}
        <div style="margin-top:6px">${tbl}</div></div>
        <table class="exg"><tr><th>T</th><th>Dirección</th><th># Pág.</th><th>Desp.</th><th>A/F</th><th># Marco</th><th>Víctima</th></tr>
        ${sim.steps.map((s,j)=>`<tr data-j="${j}"><td>${s.tl}</td><td>${s.addr}</td><td><input data-f="page"></td><td><input data-f="offset"></td><td><select data-f="af"><option></option><option>A</option><option>F</option></select></td><td><input data-f="frame"></td><td><input data-f="victim" placeholder="-"></td></tr>`).join('')}</table>
        <div class="btns"><button class="btn pri" id="exVer">Verificar</button><button class="btn" id="exStep">Revelar paso</button><button class="btn" id="exAll">Revelar todo</button><button class="btn" id="exNew">Nuevo</button><button class="btn" id="exShow">Ver en el diagrama</button></div>
        <div class="score" id="exScore"></div><div class="note">Víctima: número de página reemplazada, o "-" si es acierto o hay marco libre.</div></div>`;
      $('#exAlg', el).onchange = e=>{ algo = e.target.value; sim = simulate(cfg, algo); revealed=0; draw(); };
      const ans = (s,f)=>({page:String(s.page), offset:String(s.offset), af:s.fault?'F':'A', frame:String(s.frame), victim:s.victim?String(s.victim.page):'-'})[f];
      const fill = j=>{ $$(`tr[data-j="${j}"] [data-f]`, el).forEach(inp=>{ inp.value = ans(sim.steps[j], inp.dataset.f); inp.classList.add('ok'); inp.classList.remove('bad'); inp.classList.add('rev'); }); };
      $('#exVer', el).onclick = ()=>{ let good=0, tot=0; $$('tr[data-j]', el).forEach(tr=>{ const s=sim.steps[+tr.dataset.j]; $$('[data-f]',tr).forEach(inp=>{ tot++; const v = inp.value.trim()===''&&inp.dataset.f==='victim' ? '-' : inp.value.trim().toUpperCase(); const okk = v===ans(s,inp.dataset.f); inp.classList.toggle('ok',okk); inp.classList.toggle('bad',!okk); if(okk) good++; }); });
        $('#exScore', el).textContent = `${good} de ${tot} celdas correctas · fallos totales: ${sim.faults}`; Sound.play(good===tot?'hit':'fault'); };
      $('#exStep', el).onclick = ()=>{ if(revealed<sim.steps.length){ fill(revealed); $('#exScore', el).textContent = sim.steps[revealed].text; revealed++; } };
      $('#exAll', el).onclick = ()=>{ sim.steps.forEach((_,j)=>fill(j)); revealed=sim.steps.length; $('#exScore', el).textContent = `Fallos totales con ${ALGO_NAMES[algo]}: ${sim.faults}.`; };
      $('#exNew', el).onclick = gen;
      $('#exShow', el).onclick = ()=>{ self.algo = algo; $$('#algSel button').forEach(x=>x.classList.toggle('on',x.dataset.v===algo)); self.view='tabla'; $$('#algView button').forEach(x=>x.classList.toggle('on',x.dataset.v==='tabla')); self.setCfg(clone(cfg), false); self.render(); App.refreshPanels(true); };
    };
    gen();
  }
};
